<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الأزياء الإلكتروني</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .skeleton { animation: pulse 1.5s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- شريط التواصل السريع أعلى الشاشة -->
    <div class="bg-gray-900 text-white text-xs py-2 px-4 border-b border-gray-800">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="font-semibold text-gray-300">
                ✨ أهلاً بك في متجر ABM للملبوسات والأزياء
            </div>
            <div class="flex items-center gap-4 font-bold">
                <a href="tel:+249122324890" class="hover:text-blue-400 transition flex items-center gap-1">
                    📞 اتصل بنا: <span dir="ltr">+249122324890</span>
                </a>
                <span class="text-gray-700 hidden sm:inline">|</span>
                <a href="https://wa.me/+249918237606" target="_blank" class="bg-green-600 hover:bg-green-700 text-white px-2.5 py-1 rounded-lg transition flex items-center gap-1">
                    💬 واتساب مباشر
                </a>
            </div>
        </div>
    </div>

    <!-- شريط التنقل العلوي -->
    <nav class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🛍️</span>
                <span class="text-xl font-bold text-blue-600">ABM للملبوسات</span>
            </div>
            <a href="cart.html" class="bg-gray-100 hover:bg-gray-200 p-2 px-4 rounded-xl transition flex items-center gap-2 font-bold text-sm">
                <span>🛒 سلة المشتريات</span>
                <span id="cartCount" class="bg-blue-600 text-white text-xs px-2 py-0.5 rounded-full">0</span>
            </a>
        </div>
    </nav>

    <!-- الهيدر والواجهة الرئيسية -->
    <header class="relative bg-gray-900 text-white py-14 px-4 text-center">
        <div class="absolute inset-0 opacity-40 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?q=80&w=1000&auto=format&fit=crop');"></div>
        <div class="relative max-w-2xl mx-auto z-10">
            <h1 class="text-3xl md:text-5xl font-extrabold mb-3">أحدث صيحات الموضة والأزياء</h1>
            <p class="text-sm md:text-base text-gray-300">اكتشف تشكيلتنا الجديدة المتزامنة مباشرة مع المخازن.</p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- شريط البحث والتصفية -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
            <h2 class="text-xl md:text-2xl font-bold">✨ المنتجات المتاحة</h2>
            <div class="w-full md:w-80">
                <input type="text" id="searchInput" oninput="filterProducts()" placeholder="🔍 ابحث عن منتج..." class="w-full border rounded-xl p-2.5 text-sm bg-white outline-none focus:ring-2 focus:ring-blue-400">
            </div>
        </div>
        
        <!-- شبكة المنتجات -->
        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div class="bg-white rounded-2xl p-4 border border-gray-100 space-y-3 skeleton">
                <div class="w-full h-48 bg-gray-200 rounded-xl"></div>
                <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                <div class="h-8 bg-gray-200 rounded-xl w-full mt-2"></div>
            </div>
            <div class="bg-white rounded-2xl p-4 border border-gray-100 space-y-3 skeleton hidden sm:block">
                <div class="w-full h-48 bg-gray-200 rounded-xl"></div>
                <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                <div class="h-8 bg-gray-200 rounded-xl w-full mt-2"></div>
            </div>
            <div class="bg-white rounded-2xl p-4 border border-gray-100 space-y-3 skeleton hidden md:block">
                <div class="w-full h-48 bg-gray-200 rounded-xl"></div>
                <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                <div class="h-8 bg-gray-200 rounded-xl w-full mt-2"></div>
            </div>
            <div class="bg-white rounded-2xl p-4 border border-gray-100 space-y-3 skeleton hidden lg:block">
                <div class="w-full h-48 bg-gray-200 rounded-xl"></div>
                <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                <div class="h-8 bg-gray-200 rounded-xl w-full mt-2"></div>
            </div>
        </div>
    </main>

    <script>
        const supabaseClient = supabase.createClient(
            "https://ihlwkwiimimoiplfqcdk.supabase.co",
            "sb_publishable_Yr8COAP3Hp_cibgD1wdQZg_Ic9zZEoK"
        );

        let products = [];
        let filteredProducts = [];
        let cart = JSON.parse(localStorage.getItem('customerCart')) || [];

        // دالة معالجة واستخراج رابط الصورة من bytea أو النصوص العادية
        function getProductImageUrl(imgData) {
            const fallbackImg = "https://images.unsplash.com/photo-1479064555552-3ef4979f8908?q=80&w=500";
            if (!imgData) return fallbackImg;

            // في حال تم تخزين الرابط كنص عادي (URL)
            if (typeof imgData === 'string' && (imgData.startsWith('http://') || imgData.startsWith('https://'))) {
                return imgData;
            }

            // في حال تم تخزين الصورة كبيانات Bytea/Base64
            try {
                if (typeof imgData === 'string' && imgData.startsWith('\\x')) {
                    // تحويل السلسلة الستة عشرية إلى Base64
                    const hexStr = imgData.substring(2);
                    const bytes = new Uint8Array(hexStr.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
                    let binary = '';
                    bytes.forEach((b) => binary += String.fromCharCode(b));
                    return `data:image/jpeg;base64,${btoa(binary)}`;
                }
            } catch (e) {
                console.error("خطأ تحويل الصورة:", e);
            }

            return fallbackImg;
        }

        async function fetchProducts() {
            try {
                const { data, error } = await supabaseClient
                    .from("products")
                    .select("id_product, product_name, seal_price, qte_in_stock, image_product, department")
                    .gt("qte_in_stock", 0);
                
                if (!error && data && data.length > 0) {
                    products = data;
                    filteredProducts = data;
                } else {
                    throw new Error("بيانات فارغة أو خطأ بالاتصال");
                }
            } catch (error) {
                console.warn("استخدام بيانات احتياطية عند تعثر الاتصال:", error.message);
                products = [
                    { id_product: 101, product_name: "شورط كورة رياضي", seal_price: 650, qte_in_stock: 10 }
                ];
                filteredProducts = products;
            }
            renderProducts(filteredProducts);
            updateCartCount();
        }

        function filterProducts() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            filteredProducts = products.filter(p => 
                (p.product_name && p.product_name.toLowerCase().includes(query)) ||
                (p.department && p.department.toLowerCase().includes(query))
            );
            renderProducts(filteredProducts);
        }

        function renderProducts(itemsToRender) {
            let html = "";
            const fallbackImg = "https://images.unsplash.com/photo-1479064555552-3ef4979f8908?q=80&w=500"; 

            if (itemsToRender.length === 0) {
                document.getElementById("productsGrid").innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-400 font-semibold">
                        لا توجد منتجات مطابقة للبحث أو المتاحة حالياً.
                    </div>`;
                return;
            }

            itemsToRender.forEach(p => {
                let price = Number(p.seal_price) || 0;
                let productName = p.product_name || "منتج غير مسمى";
                let imgUrl = getProductImageUrl(p.image_product);
                
                html += `
                <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 flex flex-col justify-between p-4 transform transition duration-200 hover:shadow-md">
                    <img src="${imgUrl}" alt="${productName}" class="w-full h-48 object-cover rounded-xl bg-gray-100 mb-3" loading="lazy" onerror="this.src='${fallbackImg}'">
                    <div class="flex-1 flex flex-col justify-between gap-2">
                        <div>
                            <h3 class="font-bold text-gray-800 text-sm line-clamp-2">${productName}</h3>
                            <div class="text-blue-600 font-extrabold text-base mt-1">${price.toFixed(2)} ج.س</div>
                        </div>
                        <button onclick="addToCart(${p.id_product})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-xl transition text-xs mt-2 cursor-pointer active:scale-95">
                            ➕ إضافة للسلة
                        </button>
                    </div>
                </div>`;
            });
            document.getElementById("productsGrid").innerHTML = html;
        }

        function addToCart(id) {
            const product = products.find(p => p.id_product === id);
            if (!product) return;

            const existingItem = cart.find(item => item.id_product === id);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ 
                    id_product: product.id_product,
                    product_name: product.product_name,
                    seal_price: Number(product.seal_price) || 0,
                    quantity: 1 
                });
            }
            localStorage.setItem('customerCart', JSON.stringify(cart));
            updateCartCount();
        }

        function updateCartCount() {
            document.getElementById("cartCount").innerText = cart.reduce((sum, item) => sum + item.quantity, 0);
        }

        window.onload = fetchProducts;
    </script>
</body>
</html>
