<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المسوقين</title>

<!-- استدعاء مكتبة Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Tahoma, Arial, sans-serif;
    background: #f4f6f9;
    padding: 15px;
    margin: 0;
}

.container {
    max-width: 1000px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
}

.header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-bottom: 2px solid #f0f0f0;
    padding-bottom: 10px;
}

h2 {
    margin: 0;
    font-size: 22px;
    color: #333;
}

.logout {
    background: #444;
    color: white;
    padding: 8px 16px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
}

.grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 15px;
}

@media(min-width: 768px) {
    .grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

.input-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

label {
    font-size: 13px;
    font-weight: bold;
    color: #555;
}

input {
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    transition: 0.3s;
}

input:focus {
    border-color: #007bff;
    box-shadow: 0 0 5px rgba(0, 123, 255, 0.2);
}

.btn-container {
    margin-top: 15px;
    display: flex;
    gap: 10px;
}

button {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: 0.2s;
}

button:hover {
    opacity: 0.9;
}

.save { background: #28a745; color: white; width: 100%; }
.cancel { background: #6c757d; color: white; display: none; }
.edit { background: #ffc107; color: #333; padding: 5px 10px; font-size: 12px; }
.delete { background: #dc3545; color: white; padding: 5px 10px; font-size: 12px; }

.search-box {
    margin: 20px 0 10px 0;
}

.table-container {
    overflow-x: auto;
    margin-top: 10px;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th, td {
    border: 1px solid #e0e0e0;
    padding: 10px;
    text-align: center;
    font-size: 13px;
    vertical-align: middle;
}

th {
    background: #007bff;
    color: white;
}

tr:nth-child(even) {
    background: #f8f9fa;
}

.date-cell {
    font-size: 11px;
    color: #666;
}
</style>
</head>

<body>

<div class="container">

    <div class="header-bar">
        <h2>إدارة بيانات المسوقين</h2>
        <button class="logout" onclick="logout()">خروج</button>
    </div>

    <!-- نموذج إدخال البيانات -->
    <div class="grid">
        <div class="input-group">
            <label>اسم المسوق / العميل:</label>
            <input id="client_name" placeholder="أدخل الاسم">
        </div>

        <div class="input-group">
            <label>رقم الهاتف:</label>
            <input id="marketer_phone" placeholder="أدخل رقم الهاتف">
        </div>

        <div class="input-group">
            <label>حساب الواتساب:</label>
            <input id="marketer_account_whatsapp" placeholder="أدخل رقم أو رابط الواتساب">
        </div>

        <div class="input-group">
            <label>الحساب المصرفي / البنكي:</label>
            <input id="marketer_account" placeholder="رقم الحساب أو IBAN">
        </div>
    </div>

    <div class="btn-container">
        <button class="save" id="btnSave" onclick="saveMarketer()">حفظ البيانات</button>
        <button class="cancel" id="btnCancel" onclick="clearForm()">إلغاء التعديل</button>
    </div>

    <!-- حقل البحث -->
    <div class="search-box">
        <input type="text" id="searchBox" placeholder="بحث باسم المسوق أو رقم الهاتف..." onkeyup="searchMarketer()">
    </div>

    <!-- جدول عرض المسوقين -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>الاسم</th>
                    <th>الهاتف</th>
                    <th>الواتساب</th>
                    <th>الحساب المصرفي</th>
                    <th>تاريخ التسجيل</th>
                    <th>تعديل</th>
                    <th>حذف</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

</div>

<script>
// إعداد عميل Supabase
const supabaseUrl = "https://ihlwkwiimimoiplfqcdk.supabase.co";
const supabaseKey = "sb_publishable_Yr8COAP3Hp_cibgD1wdQZg_Ic9zZEoK";
const client = window.supabase.createClient(supabaseUrl, supabaseKey);

let edit_id = null;
let marketersList = [];

// استخراج قيمة حقل بأي صيغة أحرف تضمن عدم حدوث خطأ
function getProp(obj, propName) {
    if (!obj) return null;
    const key = Object.keys(obj).find(k => k.toLowerCase() === propName.toLowerCase());
    return key ? obj[key] : null;
}

// 1. تحميل بيانات المسوقين من Supabase
async function loadMarketers() {
    try {
        const { data, error } = await client
            .from("marketers")
            .select("*");

        if (error) throw error;

        marketersList = data || [];
        
        // ترتيب البيانات تنازلياً حسب الـ ID
        marketersList.sort((a, b) => {
            const idA = getProp(a, "id_marketer") || 0;
            const idB = getProp(b, "id_marketer") || 0;
            return idB - idA;
        });

        renderTable(marketersList);
    } catch (err) {
        console.error("خطأ في تحميل المسوقين:", err.message || err);
    }
}

// 2. عرض جدول البيانات
function renderTable(list) {
    let html = "";
    if (list.length === 0) {
        html = `<tr><td colspan="8">لا يوجد مسوقين مسجلين حالياً</td></tr>`;
    } else {
        list.forEach(m => {
            let id = getProp(m, "id_marketer");
            let name = getProp(m, "client_name");
            let phone = getProp(m, "marketer_phone");
            let whatsapp = getProp(m, "marketer_account_whatsapp");
            let account = getProp(m, "marketer_account");
            let date = getProp(m, "date_created");

            let formattedDate = date 
                ? new Date(date).toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' }) 
                : "-";

            html += `
            <tr>
                <td>${id ?? "-"}</td>
                <td><b>${name || "-"}</b></td>
                <td>${phone || "-"}</td>
                <td>${whatsapp || "-"}</td>
                <td>${account || "-"}</td>
                <td class="date-cell">${formattedDate}</td>
                <td><button class="edit" onclick="editMarketer(${id})">تعديل</button></td>
                <td><button class="delete" onclick="deleteMarketer(${id})">حذف</button></td>
            </tr>`;
        });
    }
    document.getElementById("tableBody").innerHTML = html;
}

// 3. حفظ أو تعديل مسوق
async function saveMarketer() {
    const btnSave = document.getElementById("btnSave");
    const client_name = document.getElementById("client_name").value.trim();

    if (!client_name) {
        alert("يرجى إدخال اسم المسوق على الأقل");
        return;
    }

    btnSave.disabled = true;
    btnSave.innerText = "جاري الحفظ...";

    const phoneVal = document.getElementById("marketer_phone").value.trim();
    const whatsappVal = document.getElementById("marketer_account_whatsapp").value.trim();
    const accountVal = document.getElementById("marketer_account").value.trim();

    // إرسال الحقول بالحروف الصغيرة القياسية لـ PostgreSQL
    let payload = {
        client_name: client_name,
        marketer_phone: phoneVal || null,
        marketer_account_whatsapp: whatsappVal || null,
        marketer_account: accountVal || null
    };

    try {
        let res;
        if (edit_id === null) {
            // إضافة جديد
            res = await client.from("marketers").insert([payload]);
        } else {
            // تحديث
            res = await client.from("marketers").update(payload).eq("id_marketer", edit_id);
        }

        if (res.error) {
            console.error("Supabase Error Details:", res.error);
            throw res.error;
        }

        alert("تم الحفظ بنجاح");
        clearForm();
        loadMarketers();
    } catch (err) {
        alert("خطأ أثناء الحفظ: " + (err.message || JSON.stringify(err)));
    } finally {
        btnSave.disabled = false;
        btnSave.innerText = "حفظ البيانات";
    }
}

// 4. تعبئة النموذج للتعديل
function editMarketer(id) {
    let m = marketersList.find(x => getProp(x, "id_marketer") == id);
    if (!m) return;

    document.getElementById("client_name").value = getProp(m, "client_name") || "";
    document.getElementById("marketer_phone").value = getProp(m, "marketer_phone") || "";
    document.getElementById("marketer_account_whatsapp").value = getProp(m, "marketer_account_whatsapp") || "";
    document.getElementById("marketer_account").value = getProp(m, "marketer_account") || "";

    edit_id = id;
    document.getElementById("btnSave").innerText = "تحديث البيانات";
    document.getElementById("btnCancel").style.display = "inline-block";
}

// 5. حذف مسوق
async function deleteMarketer(id) {
    if (!confirm("هل أنت تأكد من حذف بيانات هذا المسوق؟")) return;
    try {
        let { error } = await client.from("marketers").delete().eq("id_marketer", id);
        if (error) throw error;
        loadMarketers();
    } catch (err) {
        alert("خطأ عند الحذف: " + (err.message || JSON.stringify(err)));
    }
}

// 6. البحث في المسوقين
function searchMarketer() {
    let word = document.getElementById("searchBox").value.toLowerCase();
    let filtered = marketersList.filter(m => {
        let name = (getProp(m, "client_name") || "").toLowerCase();
        let phone = (getProp(m, "marketer_phone") || "").toLowerCase();
        return name.includes(word) || phone.includes(word);
    });
    renderTable(filtered);
}

// 7. تفريغ النموذج
function clearForm() {
    document.getElementById("client_name").value = "";
    document.getElementById("marketer_phone").value = "";
    document.getElementById("marketer_account_whatsapp").value = "";
    document.getElementById("marketer_account").value = "";

    edit_id = null;
    document.getElementById("btnSave").innerText = "حفظ البيانات";
    document.getElementById("btnCancel").style.display = "none";
}

// 8. تسجيل الخروج
function logout() {
    window.location.href = "index.html";
}

// التشغيل الابتدائي
loadMarketers();

</script>

</body>
</html>
