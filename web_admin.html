<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة طلبات الموقع</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        
        /* تنسيقات الطباعة */
        @media print {
            body * {
                visibility: hidden;
            }
            #printArea, #printArea * {
                visibility: visible;
            }
            #printArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white;
                padding: 20px;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 p-4 md:p-8">

    <div class="max-w-7xl mx-auto no-print">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-bold">📦 لوحة التحكم: إدارة الطلبات</h1>
                <p class="text-xs text-gray-500">متابعة طلبات العملاء وطباعة الفواتير</p>
            </div>
            <button onclick="fetchOrders()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-xl text-xs transition">
                🔄 تحديث قائمة الطلبات
            </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse text-xs md:text-sm">
                    <thead>
                        <tr class="bg-gray-50 border-b text-gray-600">
                            <th class="p-4">رقم الطلب</th>
                            <th class="p-4">اسم العميل والهاتف</th>
                            <th class="p-4">عنوان التوصيل</th>
                            <th class="p-4">المبلغ الإجمالي</th>
                            <th class="p-4">حالة الطلب</th>
                            <th class="p-4">تاريخ الطلب</th>
                            <th class="p-4 text-center">الخيارات</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <tr>
                            <td colspan="7" class="text-center p-8 text-gray-400">جاري تحميل البيانات...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- منطقة طباعة الفاتورة -->
    <div id="printArea" class="hidden"></div>

    <script>
        const supabaseClient = supabase.createClient(
            "https://ihlwkwiimimoiplfqcdk.supabase.co",
            "sb_publishable_Yr8COAP3Hp_cibgD1wdQZg_Ic9zZEoK"
        );

        let globalOrders = [];

        // 1. جلب بيانات الطلبات
        async function fetchOrders() {
            try {
                const { data: orders, error } = await supabaseClient
                    .from('web_orders')
                    .select(`
                        id_web_order,
                        client_name,
                        client_phone,
                        client_second_phone,
                        client_address,
                        total_amount,
                        order_status,
                        date_created,
                        web_order_details (
                            id_product,
                            product_name,
                            qte,
                            price,
                            amount,
                            commission
                        )
                    `)
                    .order('date_created', { ascending: false });

                if (error) throw error;
                globalOrders = orders || [];
                renderOrders(globalOrders);

            } catch (err) {
                console.error("خطأ عند جلب الطلبات:", err);
                alert("فشل جلب البيانات: " + (err.message || JSON.stringify(err)));
            }
        }

        // 2. عرض الجدول المبسط
        function renderOrders(orders) {
            const tbody = document.getElementById('ordersTableBody');
            if (!orders || orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center p-8 text-gray-500">لا توجد طلبات مسجلة حالياً.</td></tr>`;
                return;
            }

            let html = '';
            orders.forEach(order => {
                const date = order.date_created ? new Date(order.date_created).toLocaleString('ar-SD') : 'غير محدد';

                html += `
                <tr class="border-b hover:bg-gray-50 transition">
                    <td class="p-4 font-bold">#${order.id_web_order}</td>
                    <td class="p-4">
                        <div class="font-bold text-gray-900">${order.client_name || 'بدون اسم'}</div>
                        <a href="https://wa.me/${order.client_phone}" target="_blank" class="text-green-600 hover:underline dir-ltr text-xs block">
                            📱 ${order.client_phone || ''}
                        </a>
                        ${order.client_second_phone ? `<div class="text-gray-400 text-xs dir-ltr">📞 ${order.client_second_phone}</div>` : ''}
                    </td>
                    <td class="p-4 text-xs font-medium text-gray-700">
                        ${order.client_address || 'لم يحدد'}
                    </td>
                    <td class="p-4 font-bold text-blue-600">${Number(order.total_amount || 0).toFixed(2)} ج.س</td>
                    <td class="p-4">
                        <select onchange="updateStatus(${order.id_web_order}, this.value)" class="border rounded-lg p-1.5 text-xs font-bold outline-none bg-white shadow-sm">
                            <option value="قيد المراجعة" ${order.order_status === 'قيد المراجعة' ? 'selected' : ''}>⏳ قيد المراجعة</option>
                            <option value="قيد التجهيز" ${order.order_status === 'قيد التجهيز' ? 'selected' : ''}>📦 قيد التجهيز</option>
                            <option value="تم الشحن" ${order.order_status === 'تم الشحن' ? 'selected' : ''}>🚚 تم الشحن</option>
                            <option value="تم التوصيل" ${order.order_status === 'تم التوصيل' ? 'selected' : ''}>✅ تم التوصيل</option>
                            <option value="ملغي" ${order.order_status === 'ملغي' ? 'selected' : ''}>❌ ملغي</option>
                        </select>
                    </td>
                    <td class="p-4 text-xs text-gray-400 dir-ltr">${date}</td>
                    <td class="p-4 text-center">
                        <button onclick="printInvoice(${order.id_web_order})" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-1.5 px-3 rounded-lg text-xs shadow-sm transition">
                            🖨️ طباعة الفاتورة
                        </button>
                    </td>
                </tr>`;
            });

            tbody.innerHTML = html;
        }

        // 3. تحديث حالة الطلب
        async function updateStatus(orderId, newStatus) {
            try {
                const { error } = await supabaseClient
                    .from('web_orders')
                    .update({ order_status: newStatus })
                    .eq('id_web_order', orderId);

                if (error) throw error;
                alert(`تم تحديث حالة الطلب #${orderId} إلى: ${newStatus}`);
            } catch (err) {
                alert("فشل تحديث الحالة: " + err.message);
            }
        }

        // 4. بناء وطباعة الفاتورة الشاملة
        function printInvoice(orderId) {
            const order = globalOrders.find(o => o.id_web_order === orderId);
            if (!order) {
                alert("تعذر العثور على بيانات الفاتورة!");
                return;
            }

            const date = order.date_created ? new Date(order.date_created).toLocaleString('ar-SD') : '-';

            let itemsRows = '';
            let totalCommission = 0;

            if (order.web_order_details && order.web_order_details.length > 0) {
                order.web_order_details.forEach(item => {
                    const itemTotal = item.amount || ((item.qte || 0) * (item.price || 0));
                    totalCommission += Number(item.commission || 0) * Number(item.qte || 1);

                    itemsRows += `
                        <tr class="border-b text-center">
                            <td class="p-2 text-right font-semibold">${item.product_name || '-'}</td>
                            <td class="p-2">${item.qte || 0}</td>
                            <td class="p-2">${Number(item.price || 0).toFixed(2)} ج.س</td>
                            <td class="p-2 font-bold">${Number(itemTotal).toFixed(2)} ج.س</td>
                        </tr>
                    `;
                });
            } else {
                itemsRows = `<tr><td colspan="4" class="p-4 text-center text-gray-400">لا توجد تفاصيل للمنتجات</td></tr>`;
            }

            const invoiceHtml = `
                <div class="max-w-3xl mx-auto border border-gray-300 p-6 rounded-xl bg-white text-gray-800">
                    <div class="flex justify-between items-center border-b pb-4 mb-4">
                        <div>
                            <h1 class="text-2xl font-extrabold text-blue-600">فاتورة مبيعات</h1>
                            <p class="text-xs text-gray-500">رقم الطلب: #${order.id_web_order}</p>
                        </div>
                        <div class="text-left text-xs text-gray-500">
                            <div><b>التاريخ:</b> ${date}</div>
                            <div><b>حالة الطلب:</b> ${order.order_status || '-'}</div>
                        </div>
                    </div>

                    <!-- 1. بيانات العميل -->
                    <div class="bg-gray-50 p-4 rounded-lg mb-4 text-xs">
                        <h2 class="font-bold text-sm mb-2 text-gray-700 border-b pb-1">بيانات العميل:</h2>
                        <div class="grid grid-cols-2 gap-2">
                            <div><b>اسم العميل:</b> ${order.client_name || '-'}</div>
                            <div><b>رقم العميل الأساسي:</b> ${order.client_phone || '-'}</div>
                            <div><b>رقم العميل الاحتياطي:</b> ${order.client_second_phone || '-'}</div>
                            <div><b>عنوان التوصيل:</b> ${order.client_address || '-'}</div>
                        </div>
                    </div>

                    <!-- 2. جدول المنتجات والتفاصيل -->
                    <table class="w-full text-xs border-collapse mb-4">
                        <thead>
                            <tr class="bg-gray-100 border-b font-bold text-gray-700">
                                <th class="p-2 text-right">اسم المنتج</th>
                                <th class="p-2">العدد (الكمية)</th>
                                <th class="p-2">السعر الفردي (القيمة)</th>
                                <th class="p-2">الجملة</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${itemsRows}
                        </tbody>
                    </table>

                    <!-- 3. إجمالي المشتريات -->
                    <div class="flex justify-end mb-4 text-xs">
                        <div class="w-1/2 bg-blue-50 p-3 rounded-lg border border-blue-100">
                            <div class="flex justify-between font-extrabold text-blue-700 text-sm">
                                <span>إجمالي المشتريات:</span>
                                <span>${Number(order.total_amount || 0).toFixed(2)} ج.س</span>
                            </div>
                        </div>
                    </div>

                    <!-- 4. بيانات المسوق والعمولة -->
                    <div class="bg-amber-50 border border-amber-200 p-4 rounded-lg text-xs">
                        <h2 class="font-bold text-sm mb-2 text-amber-800 border-b border-amber-200 pb-1">تفاصيل عمولة الطلب:</h2>
                        <div class="grid grid-cols-2 gap-2 text-amber-900">
                            <div><b>مجموع عمولة الطلب:</b> ${Number(totalCommission).toFixed(2)} ج.س</div>
                        </div>
                    </div>
                </div>
            `;

            const printArea = document.getElementById('printArea');
            printArea.innerHTML = invoiceHtml;
            printArea.classList.remove('hidden');

            window.print();

            setTimeout(() => {
                printArea.classList.add('hidden');
            }, 500);
        }

        window.onload = fetchOrders;
    </script>
</body>
</html>
