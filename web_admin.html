<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة طلبات الموقع</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        
        /* تنسيقات الطباعة */
        @media print {
            body * {
                visibility: hidden;
            }
            #modalInvoiceCard, #modalInvoiceCard * {
                visibility: visible;
            }
            #modalInvoiceCard {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                box-shadow: none !important;
                border: none !important;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 p-4 md:p-8">

    <!-- الجدول الرئيسي -->
    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-bold">📦 لوحة التحكم: إدارة الطلبات</h1>
                <p class="text-xs text-gray-500">متابعة طلبات العملاء وطباعة الفواتير</p>
            </div>
            <button onclick="fetchOrders()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-xl text-xs transition">
                🔄 تحديث قائمة الطلبات
            </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse text-xs md:text-sm">
                    <thead>
                        <tr class="bg-gray-50 border-b text-gray-600">
                            <th class="p-4">رقم الطلب</th>
                            <th class="p-4">اسم العميل والهاتف</th>
                            <th class="p-4">عنوان التوصيل</th>
                            <th class="p-4">المبلغ الإجمالي</th>
                            <th class="p-4">تاريخ الطلب</th>
                            <th class="p-4 text-center">الخيارات</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <tr>
                            <td colspan="6" class="text-center p-8 text-gray-400">جاري تحميل البيانات...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- النافذة المنبثقة للفاتورة Modal -->
    <div id="invoiceModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden my-8 relative flex flex-col max-h-[90vh]">
            
            <!-- شريط رأس النافذة المنبثقة -->
            <div class="bg-gray-900 text-white p-4 flex justify-between items-center no-print">
                <h3 class="font-bold text-sm flex items-center gap-2">📄 معاينة الفاتورة الكاملة</h3>
                <button onclick="closeInvoiceModal()" class="text-gray-400 hover:text-white font-bold text-lg px-2">✕</button>
            </div>

            <!-- محتوى الفاتورة الذي سيتم طباعته أو مشاركته -->
            <div id="modalInvoiceCard" class="p-6 overflow-y-auto text-gray-800 space-y-4">
                <!-- يتم حقن تصميم الفاتورة هنا عن طريق JavaScript -->
            </div>

            <!-- أزرار الإجراءات والمشاركة في أسفل النافذة -->
            <div class="bg-gray-50 border-t p-4 flex flex-wrap gap-2 justify-between items-center no-print">
                <button onclick="closeInvoiceModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-xl text-xs transition">
                    إغلاق
                </button>
                
                <div class="flex flex-wrap gap-2">
                    <button id="btnShareWhatsapp" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-3 rounded-xl text-xs flex items-center gap-1 transition shadow-sm">
                        💬 مشاركة واتساب
                    </button>
                    <button onclick="copyInvoiceText()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-3 rounded-xl text-xs flex items-center gap-1 transition shadow-sm">
                        📋 نسخ النص
                    </button>
                    <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-xl text-xs flex items-center gap-1 transition shadow-sm">
                        🖨️ طباعة الفاتورة
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        const supabaseClient = supabase.createClient(
            "https://ihlwkwiimimoiplfqcdk.supabase.co",
            "sb_publishable_Yr8COAP3Hp_cibgD1wdQZg_Ic9zZEoK"
        );

        let globalOrders = [];
        let currentActiveOrder = null;

        // 1. جلب بيانات الطلبات (استعلام مطابق للحقول الحقيقية فقط)
        async function fetchOrders() {
            try {
                const { data: orders, error } = await supabaseClient
                    .from('web_orders')
                    .select(`
                        id_web_order,
                        client_name,
                        client_phone,
                        client_second_phone,
                        client_address,
                        total_amount,
                        date_created,
                        web_order_details (
                            id_product,
                            product_name,
                            qte,
                            price,
                            amount,
                            commission
                        )
                    `)
                    .order('date_created', { ascending: false });

                if (error) throw error;
                globalOrders = orders || [];
                renderOrders(globalOrders);

            } catch (err) {
                console.error("خطأ عند جلب الطلبات:", err);
                alert("فشل جلب البيانات: " + (err.message || JSON.stringify(err)));
            }
        }

        // 2. عرض الجدول الرئيسي
        function renderOrders(orders) {
            const tbody = document.getElementById('ordersTableBody');
            if (!orders || orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center p-8 text-gray-500">لا توجد طلبات مسجلة حالياً.</td></tr>`;
                return;
            }

            let html = '';
            orders.forEach(order => {
                const date = order.date_created ? new Date(order.date_created).toLocaleString('ar-SD') : 'غير محدد';

                html += `
                <tr class="border-b hover:bg-gray-50 transition">
                    <td class="p-4 font-bold">#${order.id_web_order}</td>
                    <td class="p-4">
                        <div class="font-bold text-gray-900">${order.client_name || 'بدون اسم'}</div>
                        <a href="https://wa.me/${order.client_phone}" target="_blank" class="text-green-600 hover:underline dir-ltr text-xs block">
                            📱 ${order.client_phone || ''}
                        </a>
                        ${order.client_second_phone ? `<div class="text-gray-400 text-xs dir-ltr">📞 ${order.client_second_phone}</div>` : ''}
                    </td>
                    <td class="p-4 text-xs font-medium text-gray-700">
                        ${order.client_address || 'لم يحدد'}
                    </td>
                    <td class="p-4 font-bold text-blue-600">${Number(order.total_amount || 0).toFixed(2)} ج.س</td>
                    <td class="p-4 text-xs text-gray-400 dir-ltr">${date}</td>
                    <td class="p-4 text-center">
                        <button onclick="openInvoiceModal(${order.id_web_order})" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-1.5 px-3 rounded-lg text-xs shadow-sm transition flex items-center gap-1 mx-auto">
                            👁️ عرض وطباعة
                        </button>
                    </td>
                </tr>`;
            });

            tbody.innerHTML = html;
        }

        // 3. فتح النافذة المنبثقة وعرض الفاتورة مع حساب العمولة التجميعية
        function openInvoiceModal(orderId) {
            const order = globalOrders.find(o => o.id_web_order === orderId);
            if (!order) {
                alert("تعذر العثور على بيانات الفاتورة!");
                return;
            }

            currentActiveOrder = order;
            const date = order.date_created ? new Date(order.date_created).toLocaleString('ar-SD') : '-';

            let itemsRows = '';
            let totalCommission = 0;

            if (order.web_order_details && order.web_order_details.length > 0) {
                order.web_order_details.forEach(item => {
                    const itemTotal = item.amount || ((item.qte || 0) * (item.price || 0));
                    totalCommission += Number(item.commission || 0) * Number(item.qte || 1);

                    itemsRows += `
                        <tr class="border-b text-center">
                            <td class="p-2 text-right font-semibold text-gray-800">${item.product_name || '-'}</td>
                            <td class="p-2">${item.qte || 0}</td>
                            <td class="p-2">${Number(item.price || 0).toFixed(2)} ج.س</td>
                            <td class="p-2 font-bold text-gray-900">${Number(itemTotal).toFixed(2)} ج.س</td>
                        </tr>
                    `;
                });
            } else {
                itemsRows = `<tr><td colspan="4" class="p-4 text-center text-gray-400">لا توجد تفاصيل للمنتجات</td></tr>`;
            }

            const invoiceHtml = `
                <div class="border border-gray-200 p-6 rounded-2xl bg-white space-y-4">
                    <div class="flex justify-between items-center border-b pb-4">
                        <div>
                            <h2 class="text-xl font-extrabold text-blue-600">🧾 فاتورة مبيعات</h2>
                            <p class="text-xs text-gray-500">رقم الطلب: #${order.id_web_order}</p>
                        </div>
                        <div class="text-left text-xs text-gray-500">
                            <div><b>التاريخ:</b> ${date}</div>
                        </div>
                    </div>

                    <!-- بيانات العميل -->
                    <div class="bg-gray-50 p-4 rounded-xl text-xs space-y-2">
                        <h4 class="font-bold text-sm text-gray-700 border-b pb-1">👤 بيانات العميل:</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-gray-600">
                            <div><b>الاسم:</b> ${order.client_name || '-'}</div>
                            <div><b>الهاتف الأساسي:</b> ${order.client_phone || '-'}</div>
                            <div><b>الهاتف الاحتياطي:</b> ${order.client_second_phone || '-'}</div>
                            <div><b>عنوان التوصيل:</b> ${order.client_address || '-'}</div>
                        </div>
                    </div>

                    <!-- تفاصيل العمولة -->
                    <div class="bg-amber-50 border border-amber-200 p-4 rounded-xl text-xs space-y-2">
                        <h4 class="font-bold text-sm text-amber-800 border-b border-amber-200 pb-1">📢 تفاصيل عمولة الطلب:</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-amber-900">
                            <div><b>مجموع عمولة المسوق:</b> ${Number(totalCommission).toFixed(2)} ج.س</div>
                        </div>
                    </div>

                    <!-- جدول المنتجات -->
                    <table class="w-full text-xs border-collapse">
                        <thead>
                            <tr class="bg-gray-100 border-b font-bold text-gray-700">
                                <th class="p-2 text-right">اسم المنتج</th>
                                <th class="p-2">الكمية</th>
                                <th class="p-2">السعر</th>
                                <th class="p-2">الإجمالي</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${itemsRows}
                        </tbody>
                    </table>

                    <!-- الإجمالي النهائي -->
                    <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl flex justify-between items-center text-xs">
                        <div class="font-bold text-blue-800 text-sm">💰 إجمالي الفاتورة النهائي:</div>
                        <div class="text-xl font-extrabold text-blue-900">${Number(order.total_amount || 0).toFixed(2)} ج.س</div>
                    </div>
                </div>
            `;

            document.getElementById('modalInvoiceCard').innerHTML = invoiceHtml;
            
            // إعداد رابط مشاركة الواتساب
            const shareText = buildShareText(order, totalCommission);
            const whatsappBtn = document.getElementById('btnShareWhatsapp');
            whatsappBtn.onclick = () => {
                const phone = order.client_phone ? order.client_phone.replace(/[^0-9]/g, '') : '';
                window.open(`https://wa.me/${phone}?text=${encodeURIComponent(shareText)}`, '_blank');
            };

            document.getElementById('invoiceModal').classList.remove('hidden');
        }

        // 4. إغلاق النافذة المنبثقة
        function closeInvoiceModal() {
            document.getElementById('invoiceModal').classList.add('hidden');
        }

        // 5. تجميع نص الفاتورة للمشاركة
        function buildShareText(order, commission) {
            let text = `📦 *فاتورة طلبية جديدة #${order.id_web_order}*\n`;
            text += `👤 *العميل:* ${order.client_name || '-'}\n`;
            text += `📱 *الهاتف:* ${order.client_phone || '-'}\n`;
            text += `📍 *العنوان:* ${order.client_address || '-'}\n`;
            text += `------------------------------\n`;
            text += `📢 *عمولة الطلب:* ${Number(commission).toFixed(2)} ج.س\n`;
            text += `------------------------------\n`;
            text += `🛒 *المنتجات:*\n`;

            if (order.web_order_details && order.web_order_details.length > 0) {
                order.web_order_details.forEach(item => {
                    text += `• ${item.product_name} (${item.qte} × ${item.price}) = ${item.amount || (item.qte * item.price)} ج.س\n`;
                });
            }

            text += `------------------------------\n`;
            text += `💰 *الإجمالي النهائي:* ${Number(order.total_amount || 0).toFixed(2)} ج.س\n`;
            return text;
        }

        // 6. نسخ نص الفاتورة كـ النص إلى الحافظة
        function copyInvoiceText() {
            if (!currentActiveOrder) return;
            let totalCommission = 0;
            if (currentActiveOrder.web_order_details) {
                currentActiveOrder.web_order_details.forEach(i => totalCommission += Number(i.commission || 0) * Number(i.qte || 1));
            }
            const text = buildShareText(currentActiveOrder, totalCommission);
            
            navigator.clipboard.writeText(text).then(() => {
                alert("تم نسخ تفاصيل الفاتورة إلى الحافظة بنجاح!");
            }).catch(err => {
                alert("تعذر النسخ تلقائياً");
            });
        }

        window.onload = fetchOrders;
    </script>
</body>
</html>
