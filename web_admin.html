<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إدارة طلبات الموقع - تعديل بيانات العميل</title>
    <script>
        window.tailwind = { config: { suppressDeprecationWarnings: true } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-100 text-gray-800 p-2 sm:p-4 md:p-8 min-h-screen pb-20 sm:pb-8">

    <div class="max-w-7xl mx-auto space-y-4 sm:space-y-6">
        
        <!-- شريط العنوان -->
        <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3 bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-gray-200">
            <div>
                <h1 class="text-xl sm:text-2xl font-black text-slate-900">📦 إدارة الطلبات (الخطوة 1: تعديل العميل)</h1>
                <p class="text-[11px] sm:text-xs text-gray-500 mt-0.5">مراجعة وتعديل بيانات العميل الأساسية</p>
            </div>
            
            <button onclick="fetchOrders()" class="bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 px-4 rounded-xl text-xs transition flex items-center justify-center gap-1.5 shadow-sm active:scale-95">
                🔄 <span>تحديث البيانات</span>
            </button>
        </div>

        <!-- الجدول الرئيسي -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse text-xs md:text-sm">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-100 text-gray-500 font-bold">
                            <th class="p-4">رقم الطلب</th>
                            <th class="p-4">اسم العميل</th>
                            <th class="p-4">الهاتف الأساسي</th>
                            <th class="p-4">الهاتف الثانوي</th>
                            <th class="p-4">العنوان</th>
                            <th class="p-4">المبلغ الإجمالي</th>
                            <th class="p-4 text-center">الخيارات</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <tr>
                            <td colspan="7" class="text-center p-8 text-gray-400">جاري تحميل البيانات...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- نافذة تعديل بيانات العميل -->
    <div id="editClientModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl flex flex-col border border-gray-100 p-6 space-y-4">
            
            <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                <h3 class="font-bold text-base text-slate-900">✏️ تعديل بيانات العميل <span id="modalOrderId" class="text-blue-600"></span></h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 flex items-center justify-center font-bold">✕</button>
            </div>

            <form id="editClientForm" onsubmit="handleSaveClient(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">اسم العميل:</label>
                    <input type="text" id="inputClientName" required class="w-full p-2.5 border border-gray-300 rounded-xl text-xs font-bold focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">الهاتف الأساسي:</label>
                    <input type="text" id="inputClientPhone" required class="w-full p-2.5 border border-gray-300 rounded-xl text-xs font-bold dir-ltr text-right focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">الهاتف الثانوي:</label>
                    <input type="text" id="inputClientSecondPhone" class="w-full p-2.5 border border-gray-300 rounded-xl text-xs font-bold dir-ltr text-right focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">العنوان:</label>
                    <input type="text" id="inputClientAddress" class="w-full p-2.5 border border-gray-300 rounded-xl text-xs font-bold focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div class="flex items-center justify-end gap-2 pt-3 border-t border-gray-100">
                    <button type="button" onclick="closeModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2.5 px-4 rounded-xl text-xs transition">
                        إلغاء
                    </button>
                    <button type="submit" id="saveBtn" class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-2.5 px-5 rounded-xl text-xs transition shadow-sm">
                        💾 حفظ البيانات
                    </button>
                </div>
            </form>

        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ihlwkwiimimoiplfqcdk.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Yr8COAP3Hp_cibgD1wdQZg_Ic9zZEoK"; 

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let globalOrders = [];
        let selectedOrder = null;

        // 1. جلب الطلبات (من جدول web_orders فقط لتجنب مشاكل العلاقات حالياً)
        async function fetchOrders() {
            try {
                const { data, error } = await supabaseClient
                    .from('web_orders')
                    .select('*')
                    .order('date_created', { ascending: false });

                if (error) throw error;

                globalOrders = data || [];
                renderOrdersTable();

            } catch (err) {
                console.error("خطأ عند جلب الطلبات:", err);
                alert("فشل جلب البيانات: " + err.message);
            }
        }

        // 2. عرض البيانات في الجدول
        function renderOrdersTable() {
            const tbody = document.getElementById('ordersTableBody');

            if (!globalOrders || globalOrders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center p-8 text-gray-400 font-semibold">لا توجد طلبات للعرض</td></tr>`;
                return;
            }

            let html = '';
            globalOrders.forEach(order => {
                const total = Number(order.total_amount || 0).toFixed(2);
                
                html += `
                <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                    <td class="p-4 font-bold text-gray-900">#${order.id_web_order}</td>
                    <td class="p-4 font-bold text-gray-800">${order.client_name || 'بدون اسم'}</td>
                    <td class="p-4 text-emerald-600 font-semibold dir-ltr text-right">${order.client_phone || '-'}</td>
                    <td class="p-4 text-gray-500 font-semibold dir-ltr text-right">${order.client_second_phone || '-'}</td>
                    <td class="p-4 text-gray-600">${order.client_address || '-'}</td>
                    <td class="p-4 font-black text-blue-600">${total} ج.س</td>
                    <td class="p-4 text-center">
                        <button onclick="openEditModal(${order.id_web_order})" class="bg-blue-50 hover:bg-blue-100 text-blue-600 font-bold py-1.5 px-3 rounded-lg text-xs transition">
                            ✏️ تعديل بيانات العميل
                        </button>
                    </td>
                </tr>`;
            });

            tbody.innerHTML = html;
        }

        // 3. فتح نافذة التعديل وتعبئة البيانات
        function openEditModal(orderId) {
            selectedOrder = globalOrders.find(o => o.id_web_order === orderId);
            if (!selectedOrder) return;

            document.getElementById('modalOrderId').textContent = `#${selectedOrder.id_web_order}`;
            document.getElementById('inputClientName').value = selectedOrder.client_name || '';
            document.getElementById('inputClientPhone').value = selectedOrder.client_phone || '';
            document.getElementById('inputClientSecondPhone').value = selectedOrder.client_second_phone || '';
            document.getElementById('inputClientAddress').value = selectedOrder.client_address || '';

            document.getElementById('editClientModal').classList.remove('hidden');
        }

        // 4. إغلاق النافذة
        function closeModal() {
            document.getElementById('editClientModal').classList.add('hidden');
            selectedOrder = null;
        }

        // 5. حفظ بيانات العميل في Supabase
        async function handleSaveClient(event) {
            event.preventDefault();
            if (!selectedOrder) return;

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = 'جاري الحفظ...';

            const updatedData = {
                client_name: document.getElementById('inputClientName').value,
                client_phone: document.getElementById('inputClientPhone').value,
                client_second_phone: document.getElementById('inputClientSecondPhone').value,
                client_address: document.getElementById('inputClientAddress').value
            };

            try {
                const { error } = await supabaseClient
                    .from('web_orders')
                    .update(updatedData)
                    .eq('id_web_order', selectedOrder.id_web_order);

                if (error) throw error;

                alert('✅ تم حفظ بيانات العميل بنجاح');
                closeModal();
                fetchOrders(); // إعادة جلب البيانات لتحديث الجدول

            } catch (err) {
                console.error("خطأ أثناء الحفظ:", err);
                alert('❌ تعذر الحفظ: ' + err.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = '💾 حفظ البيانات';
            }
        }

        window.onload = fetchOrders;
    </script>
</body>
</html>
