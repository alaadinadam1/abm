<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إدارة طلبات الموقع</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        @media print {
            body * { visibility: hidden; }
            #printableInvoice, #printableInvoice * { visibility: visible; }
            #printableInvoice {
                position: fixed; left: 0; top: 0; width: 100%; height: auto;
                margin: 0; padding: 15px !important; box-shadow: none !important;
                border: none !important; background: white !important;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-100 text-gray-800 p-2 sm:p-4 md:p-8 min-h-screen pb-20 sm:pb-8">

    <div class="max-w-7xl mx-auto space-y-4 sm:space-y-6">
        
        <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3 bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-gray-200">
            <div>
                <h1 class="text-xl sm:text-2xl font-black text-slate-900">📦 لوحة التحكم: إدارة الطلبات</h1>
                <p class="text-[11px] sm:text-xs text-gray-500 mt-0.5">متابعة طلبات العملاء وطباعة الفواتير والإحصائيات</p>
            </div>
            
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <div class="bg-blue-50 border border-blue-100 px-4 py-2 rounded-xl text-right flex-1 sm:flex-none">
                    <span class="text-[10px] font-bold text-blue-600 uppercase tracking-wider block">إجمالي المشتريات</span>
                    <span id="totalRevenue" class="text-lg sm:text-xl font-black text-blue-900">0.00 ج.س</span>
                </div>
                
                <button onclick="fetchOrders()" class="bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 px-4 rounded-xl text-xs transition flex items-center justify-center gap-1.5 shadow-sm active:scale-95">
                    🔄 <span class="hidden sm:inline">تحديث</span>
                </button>
            </div>
        </div>

        <div id="mobileOrdersList" class="block md:hidden space-y-3">
            <div class="text-center p-8 text-gray-400 bg-white rounded-2xl shadow-sm">جاري تحميل البيانات...</div>
        </div>

        <div class="hidden md:block bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse text-xs md:text-sm">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-100 text-gray-500 font-bold">
                            <th class="p-4">رقم الطلب</th>
                            <th class="p-4">العميل والهاتف</th>
                            <th class="p-4 min-w-[200px]">بيانات المسوق والبنك (إدخال)</th>
                            <th class="p-4">المبلغ الإجمالي</th>
                            <th class="p-4">تاريخ الطلب</th>
                            <th class="p-4 text-center">الخيارات</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <tr>
                            <td colspan="6" class="text-center p-8 text-gray-400">جاري تحميل البيانات...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="invoiceModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 overflow-y-auto">
        <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[92vh] sm:max-h-[90vh] flex flex-col border border-gray-100 animate-in slide-in-from-bottom duration-200">
            
            <div class="bg-slate-900 text-white px-4 sm:px-6 py-3.5 flex justify-between items-center no-print shrink-0 rounded-t-3xl">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <h3 class="font-bold text-xs sm:text-sm tracking-wide">معاينة وإصدار الفاتورة</h3>
                </div>
                <button onclick="closeInvoiceModal()" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-gray-300 flex items-center justify-center font-bold text-base transition active:scale-95">✕</button>
            </div>

            <div id="modalInvoiceCard" class="p-4 sm:p-6 overflow-y-auto text-gray-800 bg-white grow">
                </div>

            <div class="bg-gray-50 border-t border-gray-100 p-3 sm:p-4 flex flex-wrap sm:flex-nowrap gap-2 justify-between items-center no-print shrink-0">
                <button onclick="closeInvoiceModal()" class="hidden sm:block bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2.5 px-4 rounded-xl text-xs transition">
                    إغلاق
                </button>
                
                <div class="grid grid-cols-3 gap-2 w-full sm:w-auto">
                    <button onclick="sendToWhatsappDirectly()" class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-2.5 px-2 sm:px-3.5 rounded-xl text-[11px] sm:text-xs flex items-center justify-center gap-1 transition shadow-sm">
                        💬 واتساب
                    </button>
                    <button onclick="copyInvoiceText()" class="bg-purple-600 hover:bg-purple-700 active:scale-95 text-white font-bold py-2.5 px-2 sm:px-3.5 rounded-xl text-[11px] sm:text-xs flex items-center justify-center gap-1 transition shadow-sm">
                        📋 نسخ
                    </button>
                    <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold py-2.5 px-2 sm:px-4 rounded-xl text-[11px] sm:text-xs flex items-center justify-center gap-1 transition shadow-sm">
                        🖨️ طباعة
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ihlwkwiimimoiplfqcdk.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Yr8COAP3Hp_cibgD1wdQZg_Ic9zZEoK"; 

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let globalOrders = [];
        let currentActiveOrder = null;

        // 1. جلب الطلبات مباشرة
        async function fetchOrders() {
            try {
                const { data: orders, error } = await supabaseClient
                    .from('web_orders')
                    .select(`
                        *,
                        web_order_details (
                            id_product,
                            product_name,
                            qte,
                            price,
                            amount,
                            products (
                                id_product,
                                commission
                            )
                        )
                    `)
                    .order('date_created', { ascending: false });

                if (error) throw error;
                
                // الحفاظ على البيانات المدخلة سابقاً
                const prevData = {};
                globalOrders.forEach(o => {
                    prevData[o.id_web_order] = {
                        name: o.custom_marketer_name,
                        bank: o.custom_bank_name,
                        account: o.custom_marketer_account
                    };
                });

                globalOrders = orders || [];
                globalOrders.forEach(o => {
                    if (prevData[o.id_web_order]) {
                        o.custom_marketer_name = prevData[o.id_web_order].name || '';
                        o.custom_bank_name = prevData[o.id_web_order].bank || '';
                        o.custom_marketer_account = prevData[o.id_web_order].account || '';
                    } else {
                        o.custom_marketer_name = '';
                        o.custom_bank_name = '';
                        o.custom_marketer_account = '';
                    }
                });

                const grandTotal = globalOrders.reduce((sum, item) => sum + Number(item.total_amount || 0), 0);
                document.getElementById('totalRevenue').textContent = grandTotal.toFixed(2) + ' ج.س';

                renderOrders(globalOrders);

            } catch (err) {
                console.error("خطأ عند جلب الطلبات:", err);
                const errMsg = err.message || err.error_description || JSON.stringify(err);
                alert("فشل جلب البيانات: " + errMsg);
            }
        }

        // 2. تحديث بيانات المسوق والبنك عند الكتابة
        function setOrderMarketerData(orderId, field, value) {
            const order = globalOrders.find(o => o.id_web_order === orderId);
            if (order) {
                order[field] = value;
            }
        }

        // 3. عرض القائمة والجدول بوجود الخانات الثلاث
        function renderOrders(orders) {
            const tbody = document.getElementById('ordersTableBody');
            const mobileList = document.getElementById('mobileOrdersList');

            if (!orders || orders.length === 0) {
                const emptyHtml = `<div class="text-center p-8 text-gray-400 bg-white rounded-2xl border border-gray-100">لا توجد طلبات مسجلة حالياً.</div>`;
                tbody.innerHTML = `<tr><td colspan="6" class="text-center p-8 text-gray-400">لا توجد طلبات مسجلة حالياً.</td></tr>`;
                mobileList.innerHTML = emptyHtml;
                return;
            }

            let tableHtml = '';
            let cardsHtml = '';

            orders.forEach(order => {
                const date = order.date_created ? new Date(order.date_created).toLocaleString('ar-SD') : 'غير محدد';
                const total = Number(order.total_amount || 0).toFixed(2);

                cardsHtml += `
                <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm space-y-3">
                    <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                        <span class="font-black text-slate-900 text-sm">طلب #${order.id_web_order}</span>
                        <span class="text-blue-600 font-extrabold text-sm">${total} ج.س</span>
                    </div>
                    
                    <div class="text-xs space-y-1">
                        <div class="font-bold text-gray-900">${order.client_name || 'بدون اسم'}</div>
                        <div class="text-emerald-600 dir-ltr text-right font-semibold">📱 ${order.client_phone || '-'}</div>
                        <div class="text-gray-500 dir-ltr text-right font-semibold">📞 ${order.client_second_phone || 'لا يوجد رقم ثانٍ'}</div>
                        <div class="text-gray-500 pt-1">📍 ${order.client_address || 'لم يحدد'}</div>
                        <div class="text-[10px] text-gray-400 dir-ltr text-right pt-1">${date}</div>
                    </div>

                    <div class="bg-indigo-50/60 p-2.5 rounded-xl border border-indigo-100 space-y-1.5 text-xs">
                        <span class="text-[10px] font-bold text-indigo-700 block">بيانات المسوق والتحويل:</span>
                        <input type="text" placeholder="اسم المسوق" value="${order.custom_marketer_name || ''}" 
                            oninput="setOrderMarketerData(${order.id_web_order}, 'custom_marketer_name', this.value)"
                            class="w-full p-2 border border-indigo-200 rounded-lg bg-white text-xs focus:ring-1 focus:ring-indigo-500">
                        <input type="text" placeholder="اسم البنك (مثال: بنك الخرطوم)" value="${order.custom_bank_name || ''}" 
                            oninput="setOrderMarketerData(${order.id_web_order}, 'custom_bank_name', this.value)"
                            class="w-full p-2 border border-indigo-200 rounded-lg bg-white text-xs focus:ring-1 focus:ring-indigo-500">
                        <input type="text" placeholder="رقم الحساب البنكي" value="${order.custom_marketer_account || ''}" 
                            oninput="setOrderMarketerData(${order.id_web_order}, 'custom_marketer_account', this.value)"
                            class="w-full p-2 border border-indigo-200 rounded-lg bg-white text-xs focus:ring-1 focus:ring-indigo-500">
                    </div>

                    <div class="grid grid-cols-2 gap-2 pt-2 border-t border-gray-100">
                        <button onclick="openInvoiceModal(${order.id_web_order})" class="bg-blue-50 hover:bg-blue-100 text-blue-600 font-bold py-2 px-3 rounded-xl text-xs text-center transition">
                            👁️ عرض الفاتورة
                        </button>
                        <button onclick="deleteOrder(${order.id_web_order})" class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold py-2 px-3 rounded-xl text-xs text-center transition">
                            🗑️ حذف
                        </button>
                    </div>
                </div>`;

                tableHtml += `
                <tr class="border-b border-gray-100 hover:bg-gray-50/50 transition">
                    <td class="p-4 font-bold text-gray-900">#${order.id_web_order}</td>
                    <td class="p-4">
                        <div class="font-bold text-gray-900">${order.client_name || 'بدون اسم'}</div>
                        <div class="text-emerald-600 dir-ltr text-xs font-semibold">📱 ${order.client_phone || '-'}</div>
                        <div class="text-gray-500 text-xs dir-ltr">📞 ${order.client_second_phone || '-'}</div>
                    </td>
                    <td class="p-4 space-y-1">
                        <input type="text" placeholder="اسم المسوق" value="${order.custom_marketer_name || ''}" 
                            oninput="setOrderMarketerData(${order.id_web_order}, 'custom_marketer_name', this.value)"
                            class="w-full p-1.5 border border-indigo-100 rounded-lg bg-slate-50 focus:bg-white focus:ring-1 focus:ring-indigo-500 text-xs">
                        <input type="text" placeholder="اسم البنك" value="${order.custom_bank_name || ''}" 
                            oninput="setOrderMarketerData(${order.id_web_order}, 'custom_bank_name', this.value)"
                            class="w-full p-1.5 border border-indigo-100 rounded-lg bg-slate-50 focus:bg-white focus:ring-1 focus:ring-indigo-500 text-xs">
                        <input type="text" placeholder="رقم الحساب البنكي" value="${order.custom_marketer_account || ''}" 
                            oninput="setOrderMarketerData(${order.id_web_order}, 'custom_marketer_account', this.value)"
                            class="w-full p-1.5 border border-indigo-100 rounded-lg bg-slate-50 focus:bg-white focus:ring-1 focus:ring-indigo-500 text-xs">
                    </td>
                    <td class="p-4 font-extrabold text-blue-600">${total} ج.س</td>
                    <td class="p-4 text-xs text-gray-400 dir-ltr">${date}</td>
                    <td class="p-4">
                        <div class="flex items-center justify-center gap-2">
                            <button onclick="openInvoiceModal(${order.id_web_order})" class="bg-blue-50 hover:bg-blue-100 text-blue-600 font-bold py-1.5 px-3 rounded-lg text-xs transition">👁️ عرض</button>
                            <button onclick="deleteOrder(${order.id_web_order})" class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold py-1.5 px-3 rounded-lg text-xs transition">🗑️ حذف</button>
                        </div>
                    </td>
                </tr>`;
            });

            tbody.innerHTML = tableHtml;
            mobileList.innerHTML = cardsHtml;
        }

        // 4. حساب العمولة
        function getRealCommission(order) {
            let totalCommission = 0;
            if (!order || !order.web_order_details) return 0;

            order.web_order_details.forEach(item => {
                const quantity = Number(item.qte || 1);
                let unitCommission = 0;

                if (item.products) {
                    if (Array.isArray(item.products) && item.products.length > 0) {
                        unitCommission = Number(item.products[0].commission || 0);
                    } else if (typeof item.products === 'object') {
                        unitCommission = Number(item.products.commission || 0);
                    }
                }

                totalCommission += (unitCommission * quantity);
            });

            return totalCommission;
        }

        // 5. فتح معاينة الفاتورة
        function openInvoiceModal(orderId) {
            const order = globalOrders.find(o => o.id_web_order === orderId);
            if (!order) return;

            currentActiveOrder = order;
            const date = order.date_created ? new Date(order.date_created).toLocaleDateString('ar-SD', { year: 'numeric', month: 'short', day: 'numeric' }) : '-';
            const time = order.date_created ? new Date(order.date_created).toLocaleTimeString('ar-SD', { hour: '2-digit', minute: '2-digit' }) : '';

            let itemsRows = '';
            const realCommission = getRealCommission(order);

            if (order.web_order_details && order.web_order_details.length > 0) {
                order.web_order_details.forEach(item => {
                    const itemTotal = item.amount || ((item.qte || 0) * (item.price || 0));

                    itemsRows += `
                        <tr class="border-b border-gray-100 text-xs text-gray-700">
                            <td class="py-2.5 text-right font-semibold text-gray-800">${item.product_name || '-'}</td>
                            <td class="py-2.5 text-center font-bold text-gray-500">${item.qte || 0}</td>
                            <td class="py-2.5 text-center font-medium text-gray-500">${Number(item.price || 0).toFixed(2)}</td>
                            <td class="py-2.5 text-left font-extrabold text-gray-900">${Number(itemTotal).toFixed(2)}</td>
                        </tr>
                    `;
                });
            } else {
                itemsRows = `<tr><td colspan="4" class="py-6 text-center text-gray-400 text-xs">لا توجد منتجات مسجلة لهذا الطلب</td></tr>`;
            }

            const invoiceHtml = `
                <div id="printableInvoice" class="space-y-4 sm:space-y-6">
                    <div class="flex justify-between items-start border-b border-gray-100 pb-4">
                        <div>
                            <div class="flex items-center gap-1.5">
                                <div class="w-7 h-7 rounded-lg bg-blue-600 text-white flex items-center justify-center font-black text-xs">S</div>
                                <span class="text-[10px] sm:text-xs font-bold text-gray-400">فاتورة مبيعات</span>
                            </div>
                            <h2 class="text-xl sm:text-2xl font-black text-gray-900 mt-1">طلب #${order.id_web_order}</h2>
                        </div>
                        <div class="text-left">
                            <span class="inline-block bg-emerald-50 text-emerald-700 border border-emerald-200 text-[9px] sm:text-[10px] font-bold px-2 py-0.5 rounded-full mb-1">مكتمل</span>
                            <div class="text-[10px] sm:text-[11px] font-bold text-gray-500">${date}</div>
                            <div class="text-[9px] font-medium text-gray-400 dir-ltr">${time}</div>
                        </div>
                    </div>

                    <div class="bg-slate-50 p-3 sm:p-4 rounded-xl border border-slate-100 text-xs space-y-1.5">
                        <div class="flex items-center justify-between">
                            <span class="text-[9px] sm:text-[10px] font-extrabold text-slate-400 uppercase">بيانات العميل</span>
                            <span class="text-xs font-bold text-gray-900">${order.client_name || 'عميل نقدي'}</span>
                        </div>
                        <div class="h-px bg-slate-200/60 my-1"></div>
                        <div class="space-y-1 text-slate-600 text-[11px] sm:text-xs">
                            <div><b class="text-slate-800">📱 الهاتف الرئيسي:</b> <span class="dir-ltr font-semibold text-emerald-700">${order.client_phone || 'غير مسجل'}</span></div>
                            <div><b class="text-slate-800">📞 الهاتف الثانوي:</b> <span class="dir-ltr font-semibold text-slate-700">${order.client_second_phone || 'غير مسجل'}</span></div>
                            <div><b class="text-slate-800">📍 العنوان:</b> ${order.client_address || 'لم يحدد'}</div>
                        </div>
                    </div>

                    <div class="bg-indigo-50/70 p-3 sm:p-4 rounded-xl border border-indigo-100 text-xs space-y-1.5">
                        <div class="text-[10px] font-extrabold text-indigo-600 uppercase tracking-wider">بيانات المسوق والتحويل البنكي</div>
                        <div class="flex justify-between items-center text-slate-700 pt-1">
                            <span class="font-medium">اسم المسوق:</span>
                            <span class="font-bold text-indigo-950">${order.custom_marketer_name || 'غير محدد'}</span>
                        </div>
                        <div class="flex justify-between items-center text-slate-700">
                            <span class="font-medium">اسم البنك:</span>
                            <span class="font-bold text-slate-800">${order.custom_bank_name || 'غير محدد'}</span>
                        </div>
                        <div class="flex justify-between items-center text-slate-700">
                            <span class="font-medium">رقم الحساب البنكي:</span>
                            <span class="font-bold text-indigo-700 dir-ltr tracking-wide">${order.custom_marketer_account || 'غير محدد'}</span>
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full border-collapse">
                            <thead>
                                <tr class="border-b border-gray-200 text-gray-400 font-bold uppercase text-[9px] sm:text-[10px]">
                                    <th class="py-1.5 text-right">المنتج</th>
                                    <th class="py-1.5 text-center">الكمية</th>
                                    <th class="py-1.5 text-center">السعر</th>
                                    <th class="py-1.5 text-left">الإجمالي</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-50">
                                ${itemsRows}
                            </tbody>
                        </table>
                    </div>

                    <div class="pt-3 border-t border-gray-100 space-y-2">
                        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-3.5 sm:p-4 rounded-xl flex justify-between items-center shadow-md">
                            <div>
                                <span class="text-[9px] font-bold opacity-80 uppercase block">المبلغ الإجمالي</span>
                                <span class="text-xl sm:text-2xl font-black">${Number(order.total_amount || 0).toFixed(2)} <span class="text-xs font-normal">ج.س</span></span>
                            </div>
                            <span class="text-[10px] bg-white/20 px-2.5 py-1 rounded-md font-semibold">مدفوع</span>
                        </div>

                        <div class="flex justify-between items-center px-2 text-xs font-semibold text-slate-700 bg-slate-50 p-2.5 rounded-lg border border-slate-200/80">
                            <span>إجمالي العمولة المستحقة:</span>
                            <span class="font-black text-emerald-600 text-sm">${realCommission.toFixed(2)} ج.س</span>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('modalInvoiceCard').innerHTML = invoiceHtml;
            document.getElementById('invoiceModal').classList.remove('hidden');
        }

        function closeInvoiceModal() {
            document.getElementById('invoiceModal').classList.add('hidden');
        }

        // 6. تجهيز نص المشاركة والواتساب
        function buildShareText(order, commission) {
            const mName = order.custom_marketer_name || 'غير مسجل';
            const mBank = order.custom_bank_name || 'غير مسجل';
            const mAccount = order.custom_marketer_account || 'غير مسجل';

            let text = `📦 *فاتورة مبيعات طلبية #${order.id_web_order}*\n`;
            text += `👤 *العميل:* ${order.client_name || '-'}\n`;
            text += `📱 *الهاتف الرئيسي:* ${order.client_phone || '-'}\n`;
            text += `📞 *الهاتف الثانوي:* ${order.client_second_phone || '-'}\n`;
            text += `📍 *العنوان:* ${order.client_address || '-'}\n`;
            text += `------------------------------\n`;
            text += `👨‍💼 *المسوق:* ${mName}\n`;
            text += `🏦 *البنك:* ${mBank}\n`;
            text += `💳 *رقم الحساب:* ${mAccount}\n`;
            text += `------------------------------\n`;
            text += `🛒 *المنتجات:*\n`;

            if (order.web_order_details && order.web_order_details.length > 0) {
                order.web_order_details.forEach(item => {
                    text += `• ${item.product_name} (${item.qte} × ${item.price}) = ${item.amount || (item.qte * item.price)} ج.س\n`;
                });
            }

            text += `------------------------------\n`;
            text += `💰 *الإجمالي النهائي:* ${Number(order.total_amount || 0).toFixed(2)} ج.س\n`;
            text += `💵 *العمولة المستحقة:* ${Number(commission).toFixed(2)} ج.س\n`;
            return text;
        }

        function sendToWhatsappDirectly() {
            if (!currentActiveOrder) return;
            const realCommission = getRealCommission(currentActiveOrder);
            const messageText = buildShareText(currentActiveOrder, realCommission);
            const encodedText = encodeURIComponent(messageText);
            
            window.open(`https://api.whatsapp.com/send?text=${encodedText}`, '_blank');
        }

        function copyInvoiceText() {
            if (!currentActiveOrder) return;
            const realCommission = getRealCommission(currentActiveOrder);
            const text = buildShareText(currentActiveOrder, realCommission);
            
            navigator.clipboard.writeText(text).then(() => {
                alert("تم نسخ النص بنجاح!");
            }).catch(() => alert("تعذر النسخ"));
        }

        async function deleteOrder(orderId) {
            if (!confirm(`هل أنت تأكد من رغبتك في حذف الطلب رقم #${orderId}؟`)) return;

            try {
                await supabaseClient.from('web_order_details').delete().eq('id_web_order', orderId);
                const { error } = await supabaseClient.from('web_orders').delete().eq('id_web_order', orderId);

                if (error) throw error;
                alert('تم حذف الطلب بنجاح');
                fetchOrders();

            } catch (err) {
                console.error("خطأ الحذف:", err);
                alert("تعذر حذف الطلب: " + (err.message || JSON.stringify(err)));
            }
        }

        window.onload = fetchOrders;
    </script>
</body>
</html>
