<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إدارة الطلبات</title>
    <script>
        window.tailwind = { config: { suppressDeprecationWarnings: true } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-100 text-gray-800 p-3 sm:p-6 min-h-screen pb-20">

    <div class="max-w-5xl mx-auto space-y-4">
        
        <!-- شريط العنوان -->
        <div class="flex justify-between items-center bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-gray-200">
            <div>
                <h1 class="text-lg sm:text-2xl font-black text-slate-900">📦 قائمة الطلبات</h1>
                <p class="text-xs text-gray-500">حفظ وتعديل بيانات الطلب والمسوق والمنتجات مباشر في الطلب</p>
            </div>
            
            <button onclick="fetchOrders()" class="bg-slate-900 hover:bg-slate-800 text-white font-bold py-2 px-4 rounded-xl text-xs transition active:scale-95">
                🔄 تحديث
            </button>
        </div>

        <!-- قائمة الطلبات (بطاقات كروت) -->
        <div id="ordersCardsContainer" class="space-y-3">
            <div class="p-8 text-center bg-white rounded-2xl text-gray-400 font-semibold border border-gray-200">
                جاري تحميل الطلبات...
            </div>
        </div>

    </div>

    <!-- نافذة التعديل -->
    <div id="editOrderModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-2 sm:p-4 overflow-y-auto">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl flex flex-col border border-gray-100 p-4 sm:p-6 space-y-4 max-h-[92vh] my-auto">
            
            <div class="flex justify-between items-center border-b border-gray-100 pb-3 shrink-0">
                <h3 class="font-bold text-base text-slate-900">✏️ تعديل فاتورة طلب رقم <span id="modalOrderId" class="text-blue-600"></span></h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 flex items-center justify-center font-bold">✕</button>
            </div>

            <div class="overflow-y-auto space-y-4 grow pr-1">
                
                <!-- 1. قسم بيانات المسوق والبيانات البنكية (تُكتب هنا وتُحفظ مع الفاتورة) -->
                <div class="bg-amber-50 p-3.5 rounded-2xl border border-amber-200 space-y-3">
                    <h4 class="font-bold text-xs text-amber-900 border-b border-amber-200 pb-1.5">📢 بيانات المسوق والبنك (تُحفظ داخل الفاتورة)</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                        <div>
                            <label class="block text-[11px] font-bold text-amber-900 mb-1">اسم المسوق:</label>
                            <input type="text" id="inputMarketerName" placeholder="اسم المسوق..." class="w-full p-2 border border-amber-300 rounded-lg text-xs font-bold bg-white focus:ring-1 focus:ring-amber-500">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-amber-900 mb-1">اسم البنك:</label>
                            <input type="text" id="inputBankName" placeholder="مثال: بنك الخرطوم" class="w-full p-2 border border-amber-300 rounded-lg text-xs font-bold bg-white focus:ring-1 focus:ring-amber-500">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-amber-900 mb-1">رقم الحساب البنكي:</label>
                            <input type="text" id="inputAccountNumber" placeholder="رقم الحساب..." class="w-full p-2 border border-amber-300 rounded-lg text-xs font-bold dir-ltr text-right bg-white focus:ring-1 focus:ring-amber-500">
                        </div>
                    </div>
                </div>

                <!-- 2. قسم بيانات العميل -->
                <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 space-y-3">
                    <h4 class="font-bold text-xs text-slate-700 border-b border-slate-200 pb-1.5">👤 بيانات العميل</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        <div>
                            <label class="block text-[11px] font-bold text-gray-600 mb-1">اسم العميل:</label>
                            <input type="text" id="inputClientName" class="w-full p-2 border border-gray-300 rounded-lg text-xs font-bold bg-white focus:ring-1 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-gray-600 mb-1">الهاتف الأساسي:</label>
                            <input type="text" id="inputClientPhone" class="w-full p-2 border border-gray-300 rounded-lg text-xs font-bold dir-ltr text-right bg-white focus:ring-1 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-gray-600 mb-1">الهاتف الثانوي:</label>
                            <input type="text" id="inputClientSecondPhone" class="w-full p-2 border border-gray-300 rounded-lg text-xs font-bold dir-ltr text-right bg-white focus:ring-1 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-gray-600 mb-1">العنوان:</label>
                            <input type="text" id="inputClientAddress" class="w-full p-2 border border-gray-300 rounded-lg text-xs font-bold bg-white focus:ring-1 focus:ring-blue-500">
                        </div>
                    </div>
                </div>

                <!-- 3. قسم المنتجات -->
                <div class="space-y-3">
                    <div class="flex justify-between items-center border-b border-gray-200 pb-2">
                        <h4 class="font-bold text-xs text-slate-800">🛍️ منتجات الطلب</h4>
                        <button onclick="addNewProductRow()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded-lg border border-indigo-200 transition">
                            ➕ إضافة منتج
                        </button>
                    </div>

                    <div id="productsListContainer" class="space-y-2"></div>

                    <div class="flex justify-between items-center bg-blue-50 p-3.5 rounded-xl border border-blue-100 mt-3">
                        <span class="font-black text-slate-800 text-xs">إجمالي الفاتورة:</span>
                        <span id="calculatedTotalAmount" class="font-black text-blue-900 text-base">0.00 ج.س</span>
                    </div>
                </div>

            </div>

            <!-- أزرار الإجراءات -->
            <div class="flex items-center justify-end gap-2 pt-3 border-t border-gray-100 shrink-0">
                <button type="button" onclick="closeModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2.5 px-4 rounded-xl text-xs transition">
                    إلغاء
                </button>
                <button type="button" id="saveOrderBtn" onclick="saveOrderAndProducts()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-5 rounded-xl text-xs transition shadow-sm">
                    💾 حفظ الفاتورة بالكامل
                </button>
            </div>

        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ihlwkwiimimoiplfqcdk.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Yr8COAP3Hp_cibgD1wdQZg_Ic9zZEoK"; 

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let globalOrders = [];
        let editingOrder = null;

        // 1. جلب بيانات الطلبات
        async function fetchOrders() {
            try {
                const { data, error } = await supabaseClient
                    .from('web_orders')
                    .select('*')
                    .order('date_created', { ascending: false });

                if (error) {
                    alert("خطأ جلب البيانات: " + error.message);
                    return;
                }

                globalOrders = data || [];
                renderOrdersCards();

            } catch (err) {
                alert("خطأ اتصال: " + (err.message || JSON.stringify(err)));
            }
        }

        // 2. عرض الطلبات
        function renderOrdersCards() {
            const container = document.getElementById('ordersCardsContainer');

            if (!globalOrders || globalOrders.length === 0) {
                container.innerHTML = `<div class="p-8 text-center bg-white rounded-2xl text-gray-400 font-semibold border border-gray-200">لا توجد طلبات لعرضها</div>`;
                return;
            }

            let html = '';
            globalOrders.forEach(order => {
                const total = Number(order.total_amount || 0).toFixed(2);
                const marketer = order.marketer_name || order.marketer || 'غير محدد';
                const bank = order.bank_name || 'غير محدد';
                const acc = order.account_number || 'غير محدد';

                html += `
                <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm space-y-3">
                    <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                        <span class="font-black text-slate-900 text-sm">طلب #${order.id_web_order}</span>
                        <span class="font-black text-blue-600 text-sm">${total} ج.س</span>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                        <div><span class="text-gray-400 font-bold">العميل:</span> <span class="font-bold text-gray-800">${order.client_name || '-'}</span></div>
                        <div><span class="text-gray-400 font-bold">المسوق:</span> <span class="font-bold text-amber-700">${marketer}</span></div>
                        <div><span class="text-gray-400 font-bold">البنك:</span> <span class="font-bold text-gray-700">${bank}</span></div>
                        <div><span class="text-gray-400 font-bold">رقم الحساب:</span> <span class="font-bold text-gray-700 dir-ltr inline-block">${acc}</span></div>
                    </div>

                    <div class="pt-2 border-t border-gray-100 flex justify-end">
                        <button onclick="openEditModal(${order.id_web_order})" class="bg-blue-50 hover:bg-blue-100 text-blue-600 font-bold py-1.5 px-4 rounded-xl text-xs transition">
                            ✏️ تعديل البيانات والمنتجات
                        </button>
                    </div>
                </div>`;
            });

            container.innerHTML = html;
        }

        // 3. فتح نافذة التعديل
        async function openEditModal(orderId) {
            const originalOrder = globalOrders.find(o => o.id_web_order === orderId);
            if (!originalOrder) return;

            editingOrder = JSON.parse(JSON.stringify(originalOrder));
            editingOrder.web_order_details = [];

            document.getElementById('modalOrderId').textContent = `#${editingOrder.id_web_order}`;
            
            // جلب البيانات المخزنة بنفس سطر الفاتورة
            document.getElementById('inputMarketerName').value = editingOrder.marketer_name || editingOrder.marketer || '';
            document.getElementById('inputBankName').value = editingOrder.bank_name || '';
            document.getElementById('inputAccountNumber').value = editingOrder.account_number || '';
            
            document.getElementById('inputClientName').value = editingOrder.client_name || '';
            document.getElementById('inputClientPhone').value = editingOrder.client_phone || '';
            document.getElementById('inputClientSecondPhone').value = editingOrder.client_second_phone || '';
            document.getElementById('inputClientAddress').value = editingOrder.client_address || '';

            try {
                const { data: details } = await supabaseClient
                    .from('web_order_details')
                    .select('*')
                    .eq('id_web_order', orderId);

                if (details) editingOrder.web_order_details = details;
            } catch (e) {
                console.error("خطأ منتجات الفاتورة:", e);
            }

            renderProductsList();
            document.getElementById('editOrderModal').classList.remove('hidden');
        }

        // 4. إدارة عناصر المنتجات
        function renderProductsList() {
            const container = document.getElementById('productsListContainer');
            let totalAmount = 0;

            if (!editingOrder.web_order_details || editingOrder.web_order_details.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 text-xs py-3 border border-dashed rounded-xl">لا توجد منتجات</p>`;
            } else {
                let html = '';
                editingOrder.web_order_details.forEach((item, index) => {
                    const lineAmount = (Number(item.qte) || 0) * (Number(item.price) || 0);
                    item.amount = lineAmount;
                    totalAmount += lineAmount;

                    html += `
                    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 bg-gray-50 p-2.5 rounded-xl border border-gray-200">
                        <div class="flex-1">
                            <label class="block text-[10px] font-bold text-gray-500 mb-0.5">المنتج</label>
                            <input type="text" value="${item.product_name || ''}" 
                                oninput="updateProductField(${index}, 'product_name', this.value)"
                                class="w-full p-1.5 border border-gray-300 rounded-lg text-xs font-bold bg-white">
                        </div>
                        <div class="w-20">
                            <label class="block text-[10px] font-bold text-gray-500 mb-0.5">الكمية</label>
                            <input type="number" min="1" value="${item.qte || 1}" 
                                oninput="updateProductField(${index}, 'qte', this.value)"
                                class="w-full p-1.5 border border-gray-300 rounded-lg text-xs font-bold text-center bg-white">
                        </div>
                        <div class="w-24">
                            <label class="block text-[10px] font-bold text-gray-500 mb-0.5">السعر</label>
                            <input type="number" min="0" step="0.01" value="${item.price || 0}" 
                                oninput="updateProductField(${index}, 'price', this.value)"
                                class="w-full p-1.5 border border-gray-300 rounded-lg text-xs font-bold text-center bg-white">
                        </div>
                        <div class="w-24 text-center sm:text-right">
                            <span class="block text-[10px] font-bold text-gray-400">المجموع</span>
                            <span class="text-xs font-black text-blue-600">${lineAmount.toFixed(2)}</span>
                        </div>
                        <div class="flex items-center justify-center pt-1 sm:pt-3">
                            <button onclick="removeProductRow(${index})" class="text-rose-600 hover:bg-rose-100 p-1.5 rounded-lg text-xs transition">
                                🗑️
                            </button>
                        </div>
                    </div>`;
                });
                container.innerHTML = html;
            }

            editingOrder.total_amount = totalAmount;
            document.getElementById('calculatedTotalAmount').textContent = totalAmount.toFixed(2) + ' ج.س';
        }

        function updateProductField(index, field, value) {
            if (!editingOrder || !editingOrder.web_order_details[index]) return;
            editingOrder.web_order_details[index][field] = (field === 'qte' || field === 'price') ? (Number(value) || 0) : value;
            renderProductsList();
        }

        function addNewProductRow() {
            if (!editingOrder) return;
            if (!editingOrder.web_order_details) editingOrder.web_order_details = [];
            editingOrder.web_order_details.push({ product_name: "منتج جديد", qte: 1, price: 0, amount: 0 });
            renderProductsList();
        }

        function removeProductRow(index) {
            if (!editingOrder) return;
            editingOrder.web_order_details.splice(index, 1);
            renderProductsList();
        }

        // 5. حفظ كافة بيانات الفاتورة المباشرة في جدول web_orders
        async function saveOrderAndProducts() {
            if (!editingOrder) return;

            const saveBtn = document.getElementById('saveOrderBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = 'جاري الحفظ...';

            // تجميع كافة البيانات ليتم إرسالها لجدول الطلبات فقط
            const payload = {
                client_name: document.getElementById('inputClientName').value || null,
                client_phone: document.getElementById('inputClientPhone').value || null,
                client_second_phone: document.getElementById('inputClientSecondPhone').value || null,
                client_address: document.getElementById('inputClientAddress').value || null,
                marketer_name: document.getElementById('inputMarketerName').value || null,
                bank_name: document.getElementById('inputBankName').value || null,
                account_number: document.getElementById('inputAccountNumber').value || null,
                total_amount: editingOrder.total_amount || 0
            };

            try {
                // حفظ البيانات بجدول الطلبات الرئيسي
                const { error: orderErr } = await supabaseClient
                    .from('web_orders')
                    .update(payload)
                    .eq('id_web_order', editingOrder.id_web_order);

                if (orderErr) {
                    throw new Error(orderErr.message || JSON.stringify(orderErr));
                }

                // تحديث تفاصيل المنتجات
                await supabaseClient
                    .from('web_order_details')
                    .delete()
                    .eq('id_web_order', editingOrder.id_web_order);

                if (editingOrder.web_order_details && editingOrder.web_order_details.length > 0) {
                    const rowsToInsert = editingOrder.web_order_details.map(item => ({
                        id_web_order: editingOrder.id_web_order,
                        product_name: item.product_name || 'منتج',
                        qte: Number(item.qte) || 1,
                        price: Number(item.price) || 0,
                        amount: Number(item.amount) || 0
                    }));

                    const { error: insertErr } = await supabaseClient
                        .from('web_order_details')
                        .insert(rowsToInsert);

                    if (insertErr) throw new Error(insertErr.message);
                }

                alert('✅ تم حفظ كافة البيانات بنجاح في الفاتورة');
                closeModal();
                fetchOrders();

            } catch (err) {
                console.error("خطأ الحفظ:", err);
                alert('❌ تعذر الحفظ:\n' + err.message + '\n\nبرجاء مراجعة خطوة إضافة الأعمدة في Supabase إذا استمر هذا الخطأ.');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = '💾 حفظ الفاتورة بالكامل';
            }
        }

        function closeModal() {
            document.getElementById('editOrderModal').classList.add('hidden');
            editingOrder = null;
        }

        window.onload = fetchOrders;
    </script>
</body>
</html>
