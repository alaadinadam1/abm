<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة طلبات الموقع</title>
    <script>window.tailwind = { config: { suppressDeprecationWarnings: true } };</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-100 text-gray-800 p-2 sm:p-4 md:p-8 min-h-screen">

    <div class="max-w-7xl mx-auto space-y-4">
        
        <!-- شريط التشخيص واكتشاف الحقول -->
        <div id="debugBox" class="bg-amber-100 border border-amber-300 p-3 rounded-xl text-xs text-amber-900 hidden">
            <strong>🔍 تشخيص الحقول المخزنة في جدول web_order_details:</strong>
            <div id="debugFields" class="font-mono mt-1 text-[11px] text-amber-800"></div>
        </div>

        <!-- شريط العنوان -->
        <div class="flex justify-between items-center bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-gray-200">
            <div>
                <h1 class="text-xl sm:text-2xl font-black text-slate-900">📦 الطلبات المعلقة (قيد الانتظار)</h1>
                <p class="text-xs text-gray-500">مراجعة واعتماد الطلبات</p>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="bg-blue-50 border border-blue-100 px-4 py-2 rounded-xl text-right">
                    <span class="text-[10px] font-bold text-blue-600 block">إجمالي المعلق</span>
                    <span id="totalRevenue" class="text-lg font-black text-blue-900">0.00 ج.س</span>
                </div>
                <button onclick="fetchOrders()" class="bg-slate-900 text-white font-bold py-2.5 px-4 rounded-xl text-xs">🔄 تحديث</button>
            </div>
        </div>

        <!-- عرض الجوال -->
        <div id="mobileOrdersList" class="block md:hidden space-y-3"></div>

        <!-- الجدول الرئيسي -->
        <div class="hidden md:block bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <table class="w-full text-right border-collapse text-xs md:text-sm">
                <thead>
                    <tr class="bg-gray-50 border-b border-gray-100 text-gray-500 font-bold">
                        <th class="p-4">رقم الطلب</th>
                        <th class="p-4">العميل والهاتف</th>
                        <th class="p-4 min-w-[200px]">بيانات المسوق والبنك</th>
                        <th class="p-4">العمولة المستحقة</th>
                        <th class="p-4">الحالة</th>
                        <th class="p-4">المبلغ الإجمالي</th>
                        <th class="p-4 text-center">الخيارات</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                    <tr><td colspan="7" class="text-center p-8 text-gray-400">جاري تحميل البيانات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ihlwkwiimimoiplfqcdk.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Yr8COAP3Hp_cibgD1wdQZg_Ic9zZEoK"; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let globalOrders = [];

        function getSavedExtraData() {
            try { return JSON.parse(localStorage.getItem('orders_extra_data')) || {}; } catch (e) { return {}; }
        }

        function saveExtraData(data) {
            try { localStorage.setItem('orders_extra_data', JSON.stringify(data)); } catch (e) {}
        }

        async function fetchOrders() {
            try {
                // 1. جلب الطلبات
                const { data: orders, error: ordersError } = await supabaseClient
                    .from('web_orders')
                    .select('*')
                    .order('date_created', { ascending: false });

                if (ordersError) throw ordersError;
                let fetchedOrders = orders || [];

                if (fetchedOrders.length > 0) {
                    const orderIds = fetchedOrders.map(o => o.id_web_order);
                    
                    // 2. جلب جميع تفاصيل الطلبات بدون شروط
                    const { data: details, error: detailsError } = await supabaseClient
                        .from('web_order_details')
                        .select('*')
                        .in('id_web_order', orderIds);

                    if (detailsError) throw detailsError;

                    // إظهار أسماء الحقول الفعلية في شريط التشخيص بالموقع
                    if (details && details.length > 0) {
                        const sampleItem = details[0];
                        document.getElementById('debugBox').classList.remove('hidden');
                        document.getElementById('debugFields').innerText = "الحقول الموجودة في قاعدة البيانات هي: " + Object.keys(sampleItem).join(' | ');
                    }

                    const detailsMap = {};
                    (details || []).forEach(d => {
                        if (!detailsMap[d.id_web_order]) detailsMap[d.id_web_order] = [];
                        detailsMap[d.id_web_order].push(d);
                    });

                    fetchedOrders.forEach(o => {
                        o.web_order_details = detailsMap[o.id_web_order] || [];
                    });
                }

                const savedExtra = getSavedExtraData();
                globalOrders = fetchedOrders;

                globalOrders.forEach(o => {
                    // البحث الذكي عن قيمة العمولة مهما كان اسم الحقل المخزن بها
                    const calculatedCommission = (o.web_order_details || []).reduce((sum, item) => {
                        const qte = Number(item.qte || item.quantity || 1);
                        // فحص جميع الاحتمالات الممكنة لاسم حقل العمولة
                        const commVal = Number(item.commission || item.comm || item.item_commission || item.product_commission || item.commision || 0);
                        return sum + (qte * commVal);
                    }, 0);

                    o.calculated_commission = calculatedCommission;

                    const extra = savedExtra[o.id_web_order] || {};
                    o.custom_marketer_name = extra.name !== undefined ? extra.name : (o.custom_marketer_name || '');
                    o.custom_bank_name = extra.bank !== undefined ? extra.bank : (o.custom_bank_name || '');
                    o.custom_marketer_account = extra.account !== undefined ? extra.account : (o.custom_marketer_account || '');
                    o.custom_commission = extra.commission !== undefined ? extra.commission : '';
                    o.is_approved = extra.isApproved !== undefined ? extra.isApproved : (o.is_approved || false);
                });

                renderUI();

            } catch (err) {
                console.error("خطأ:", err);
                alert("حدث خطأ أثناء جلب البيانات: " + err.message);
            }
        }

        function renderUI() {
            const pendingOrders = globalOrders.filter(o => !o.is_approved);
            const grandTotal = pendingOrders.reduce((sum, item) => sum + Number(item.total_amount || 0), 0);
            document.getElementById('totalRevenue').textContent = grandTotal.toFixed(2) + ' ج.س';

            renderOrders(pendingOrders);
        }

        function setOrderMarketerData(orderId, field, value) {
            const order = globalOrders.find(o => o.id_web_order === orderId);
            if (order) {
                order[field] = value;
                const savedExtra = getSavedExtraData();
                if (!savedExtra[orderId]) savedExtra[orderId] = {};
                if (field === 'custom_marketer_name') savedExtra[orderId].name = value;
                if (field === 'custom_bank_name') savedExtra[orderId].bank = value;
                if (field === 'custom_marketer_account') savedExtra[orderId].account = value;
                if (field === 'custom_commission') savedExtra[orderId].commission = value;
                saveExtraData(savedExtra);
            }
        }

        async function toggleApproval(orderId) {
            const order = globalOrders.find(o => o.id_web_order === orderId);
            if (!order) return;

            order.is_approved = !order.is_approved;
            const savedExtra = getSavedExtraData();
            if (!savedExtra[orderId]) savedExtra[orderId] = {};
            savedExtra[orderId].isApproved = order.is_approved;
            saveExtraData(savedExtra);

            renderUI();
        }

        function renderOrders(orders) {
            const tbody = document.getElementById('ordersTableBody');
            const mobileList = document.getElementById('mobileOrdersList');

            if (!orders || orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center p-8 text-gray-400">لا توجد طلبات معلقة حالياً</td></tr>`;
                mobileList.innerHTML = `<div class="text-center p-8 text-gray-400 bg-white rounded-2xl">لا توجد طلبات معلقة حالياً</div>`;
                return;
            }

            let tableHtml = '';
            let cardsHtml = '';

            orders.forEach(order => {
                // إظهار العمولة المعدلة إذا أُدخلت يدوياً، أو المحسوبة تلقائياً
                const displayCommission = (order.custom_commission !== '' && order.custom_commission !== null && order.custom_commission !== undefined)
                    ? Number(order.custom_commission).toFixed(2)
                    : Number(order.calculated_commission || 0).toFixed(2);

                const total = Number(order.total_amount || 0).toFixed(2);

                // كروت الجوال
                cardsHtml += `
                <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm space-y-3">
                    <div class="flex justify-between items-center border-b pb-2">
                        <span class="font-black text-slate-900">طلب #${order.id_web_order}</span>
                        <span class="text-blue-600 font-extrabold">${total} ج.س</span>
                    </div>
                    
                    <div class="text-xs space-y-1">
                        <div class="font-bold">${order.client_name || 'بدون اسم'}</div>
                        <div class="text-emerald-600 dir-ltr text-right">📱 ${order.client_phone || '-'}</div>
                    </div>

                    <div class="bg-amber-50 p-2.5 rounded-xl border border-amber-200 flex justify-between items-center text-xs">
                        <span class="font-bold text-amber-900">💵 العمولة المستحقة:</span>
                        <span class="font-black text-amber-700 text-sm">${displayCommission} ج.س</span>
                    </div>

                    <div class="bg-indigo-50/70 p-3 rounded-xl border border-indigo-100 space-y-2 text-xs">
                        <input type="text" placeholder="اسم المسوق" value="${order.custom_marketer_name || ''}" 
                            oninput="setOrderMarketerData(${order.id_web_order}, 'custom_marketer_name', this.value)"
                            class="w-full p-2 border border-indigo-200 rounded-lg bg-white">
                        <input type="text" placeholder="اسم البنك" value="${order.custom_bank_name || ''}" 
                            oninput="setOrderMarketerData(${order.id_web_order}, 'custom_bank_name', this.value)"
                            class="w-full p-2 border border-indigo-200 rounded-lg bg-white">
                        <input type="text" placeholder="رقم الحساب البنكي" value="${order.custom_marketer_account || ''}" 
                            oninput="setOrderMarketerData(${order.id_web_order}, 'custom_marketer_account', this.value)"
                            class="w-full p-2 border border-indigo-200 rounded-lg bg-white">
                        <input type="number" placeholder="تعديل العمولة يدوياً (ج.س)" value="${order.custom_commission || ''}" 
                            oninput="setOrderMarketerData(${order.id_web_order}, 'custom_commission', this.value)"
                            class="w-full p-2 border border-indigo-200 rounded-lg bg-white font-bold text-amber-700">
                    </div>

                    <button onclick="toggleApproval(${order.id_web_order})" class="w-full bg-emerald-600 text-white font-bold py-2 rounded-xl text-xs">
                        ✅ اعتماد الفاتورة
                    </button>
                </div>`;

                // جدول الكمبيوتر
                tableHtml += `
                <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                    <td class="p-4 font-bold">#${order.id_web_order}</td>
                    <td class="p-4">
                        <div class="font-bold">${order.client_name || 'بدون اسم'}</div>
                        <div class="text-emerald-600 dir-ltr text-xs">📱 ${order.client_phone || '-'}</div>
                    </td>
                    <td class="p-4 space-y-1.5">
                        <input type="text" placeholder="اسم المسوق" value="${order.custom_marketer_name || ''}" 
                            oninput="setOrderMarketerData(${order.id_web_order}, 'custom_marketer_name', this.value)"
                            class="w-full p-1.5 border border-indigo-200 rounded-lg text-xs">
                        <input type="text" placeholder="اسم البنك" value="${order.custom_bank_name || ''}" 
                            oninput="setOrderMarketerData(${order.id_web_order}, 'custom_bank_name', this.value)"
                            class="w-full p-1.5 border border-indigo-200 rounded-lg text-xs">
                        <input type="text" placeholder="رقم الحساب" value="${order.custom_marketer_account || ''}" 
                            oninput="setOrderMarketerData(${order.id_web_order}, 'custom_marketer_account', this.value)"
                            class="w-full p-1.5 border border-indigo-200 rounded-lg text-xs">
                        <input type="number" placeholder="تعديل العمولة (ج.س)" value="${order.custom_commission || ''}" 
                            oninput="setOrderMarketerData(${order.id_web_order}, 'custom_commission', this.value)"
                            class="w-full p-1.5 border border-indigo-200 rounded-lg text-xs font-bold text-amber-700">
                    </td>
                    <td class="p-4">
                        <span class="inline-block bg-amber-100 text-amber-900 font-extrabold px-3 py-1.5 rounded-xl border border-amber-200 text-xs">
                            💵 ${displayCommission} ج.س
                        </span>
                    </td>
                    <td class="p-4"><span class="bg-amber-100 text-amber-800 text-[10px] font-extrabold px-2.5 py-1 rounded-full">⏳ معلق</span></td>
                    <td class="p-4 font-extrabold text-blue-600">${total} ج.س</td>
                    <td class="p-4 text-center">
                        <button onclick="toggleApproval(${order.id_web_order})" class="bg-emerald-50 text-emerald-700 border border-emerald-200 font-bold py-1.5 px-3 rounded-lg text-xs hover:bg-emerald-100">
                            ✅ اعتماد
                        </button>
                    </td>
                </tr>`;
            });

            tbody.innerHTML = tableHtml;
            mobileList.innerHTML = cardsHtml;
        }

        document.addEventListener("DOMContentLoaded", fetchOrders);
    </script>
</body>
</html>
