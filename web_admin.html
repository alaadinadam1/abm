<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إدارة طلبات الموقع</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        @media print {
            body * { visibility: hidden; }
            #printableInvoice, #printableInvoice * { visibility: visible; }
            #printableInvoice {
                position: fixed; left: 0; top: 0; width: 100%; height: auto;
                margin: 0; padding: 15px !important; box-shadow: none !important;
                border: none !important; background: white !important;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-100 text-gray-800 p-2 sm:p-4 md:p-8 min-h-screen pb-20 sm:pb-8">

    <div class="max-w-7xl mx-auto space-y-4 sm:space-y-6">
        
        <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3 bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-gray-200">
            <div>
                <h1 class="text-xl sm:text-2xl font-black text-slate-900">📦 لوحة التحكم: إدارة الطلبات</h1>
                <p class="text-[11px] sm:text-xs text-gray-500 mt-0.5">متابعة طلبات العملاء وطباعة الفواتير والإحصائيات</p>
            </div>
            
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <div class="bg-blue-50 border border-blue-100 px-4 py-2 rounded-xl text-right flex-1 sm:flex-none">
                    <span class="text-[10px] font-bold text-blue-600 uppercase tracking-wider block">إجمالي المشتريات</span>
                    <span id="totalRevenue" class="text-lg sm:text-xl font-black text-blue-900">0.00 ج.س</span>
                </div>
                
                <button onclick="fetchOrders()" class="bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 px-4 rounded-xl text-xs transition flex items-center justify-center gap-1.5 shadow-sm active:scale-95">
                    🔄 <span class="hidden sm:inline">تحديث</span>
                </button>
            </div>
        </div>

        <div id="mobileOrdersList" class="block md:hidden space-y-3">
            <div class="text-center p-8 text-gray-400 bg-white rounded-2xl shadow-sm">جاري تحميل البيانات...</div>
        </div>

        <div class="hidden md:block bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse text-xs md:text-sm">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-100 text-gray-500 font-bold">
                            <th class="p-4">رقم الطلب</th>
                            <th class="p-4">العميل والهاتف</th>
                            <th class="p-4">العنوان</th>
                            <th class="p-4">المبلغ الإجمالي</th>
                            <th class="p-4">تاريخ الطلب</th>
                            <th class="p-4 text-center">الخيارات</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <tr>
                            <td colspan="6" class="text-center p-8 text-gray-400">جاري تحميل البيانات...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="invoiceModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 overflow-y-auto">
        <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[92vh] sm:max-h-[90vh] flex flex-col border border-gray-100 animate-in slide-in-from-bottom duration-200">
            
            <div class="bg-slate-900 text-white px-4 sm:px-6 py-3.5 flex justify-between items-center no-print shrink-0 rounded-t-3xl">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <h3 class="font-bold text-xs sm:text-sm tracking-wide">معاينة الفاتورة</h3>
                </div>
                <button onclick="closeInvoiceModal()" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-gray-300 flex items-center justify-center font-bold text-base transition active:scale-95">✕</button>
            </div>

            <div id="modalInvoiceCard" class="p-4 sm:p-6 overflow-y-auto text-gray-800 bg-white grow">
                </div>

            <div class="bg-gray-50 border-t border-gray-100 p-3 sm:p-4 flex flex-wrap sm:flex-nowrap gap-2 justify-between items-center no-print shrink-0">
                <button onclick="closeInvoiceModal()" class="hidden sm:block bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2.5 px-4 rounded-xl text-xs transition">
                    إغلاق
                </button>
                
                <div class="grid grid-cols-3 gap-2 w-full sm:w-auto">
                    <button onclick="sendToWhatsappDirectly()" class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-2.5 px-2 sm:px-3.5 rounded-xl text-[11px] sm:text-xs flex items-center justify-center gap-1 transition shadow-sm">
                        💬 واتساب
                    </button>
                    <button onclick="copyInvoiceText()" class="bg-purple-600 hover:bg-purple-700 active:scale-95 text-white font-bold py-2.5 px-2 sm:px-3.5 rounded-xl text-[11px] sm:text-xs flex items-center justify-center gap-1 transition shadow-sm">
                        📋 نسخ
                    </button>
                    <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold py-2.5 px-2 sm:px-4 rounded-xl text-[11px] sm:text-xs flex items-center justify-center gap-1 transition shadow-sm">
                        🖨️ طباعة
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // تنبيه: يرجى وضع المفتاح الخاص بـ Supabase (Anon Key الذي يبدأ عادة بـ eyJ...) هنا
        const SUPABASE_URL = "https://ihlwkwiimimoiplfqcdk.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Yr8COAP3Hp_cibgD1wdQZg_Ic9zZEoK"; 

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let globalOrders = [];
        let currentActiveOrder = null;

        // 1. جلب الطلبات وقيمة العمولة المباشرة مع بيانات المسوق من tb_users المربوطة بـ id_user
        async function fetchOrders() {
            try {
                const { data: orders, error } = await supabaseClient
                    .from('web_orders')
                    .select(`
                        id_web_order,
                        client_name,
                        client_phone,
                        client_second_phone,
                        client_address,
                        total_amount,
                        date_created,
                        id_user,
                        tb_users:id_user (
                            id,
                            username,
                            fullname,
                            bank_account
                        ),
                        web_order_details (
                            id_product,
                            product_name,
                            qte,
                            price,
                            amount,
                            products (
                                id_product,
                                commission
                            )
                        )
                    `)
                    .order('date_created', { ascending: false });

                if (error) throw error;
                globalOrders = orders || [];
                
                const grandTotal = globalOrders.reduce((sum, item) => sum + Number(item.total_amount || 0), 0);
                document.getElementById('totalRevenue').textContent = grandTotal.toFixed(2) + ' ج.س';

                renderOrders(globalOrders);

            } catch (err) {
                console.error("خطأ عند جلب الطلبات:", err);
                alert("فشل جلب البيانات: " + (err.message || JSON.stringify(err)));
            }
        }

        // 2. عرض القائمة والجدول
        function renderOrders(orders) {
            const tbody = document.getElementById('ordersTableBody');
            const mobileList = document.getElementById('mobileOrdersList');

            if (!orders || orders.length === 0) {
                const emptyHtml = `<div class="text-center p-8 text-gray-400 bg-white rounded-2xl border border-gray-100">لا توجد طلبات مسجلة حالياً.</div>`;
                tbody.innerHTML = `<tr><td colspan="6" class="text-center p-8 text-gray-400">لا توجد طلبات مسجلة حالياً.</td></tr>`;
                mobileList.innerHTML = emptyHtml;
                return;
            }

            let tableHtml = '';
            let cardsHtml = '';

            orders.forEach(order => {
                const date = order.date_created ? new Date(order.date_created).toLocaleString('ar-SD') : 'غير محدد';
                const total = Number(order.total_amount || 0).toFixed(2);

                cardsHtml += `
                <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm space-y-3">
                    <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                        <span class="font-black text-slate-900 text-sm">طلب #${order.id_web_order}</span>
                        <span class="text-blue-600 font-extrabold text-sm">${total} ج.س</span>
                    </div>
                    
                    <div class="text-xs space-y-1">
                        <div class="font-bold text-gray-900">${order.client_name || 'بدون اسم'}</div>
                        <div class="text-emerald-600 dir-ltr text-right font-semibold">📱 ${order.client_phone || '-'}</div>
                        <div class="text-gray-500 dir-ltr text-right font-semibold">📞 ${order.client_second_phone || 'لا يوجد رقم ثانٍ'}</div>
                        <div class="text-gray-500 pt-1">📍 ${order.client_address || 'لم يحدد'}</div>
                        <div class="text-[10px] text-gray-400 dir-ltr text-right pt-1">${date}</div>
                    </div>

                    <div class="grid grid-cols-2 gap-2 pt-2 border-t border-gray-100">
                        <button onclick="openInvoiceModal(${order.id_web_order})" class="bg-blue-50 hover:bg-blue-100 text-blue-600 font-bold py-2 px-3 rounded-xl text-xs text-center transition">
                            👁️ عرض الفاتورة
                        </button>
                        <button onclick="deleteOrder(${order.id_web_order})" class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold py-2 px-3 rounded-xl text-xs text-center transition">
                            🗑️ حذف
                        </button>
                    </div>
                </div>`;

                tableHtml += `
                <tr class="border-b border-gray-100 hover:bg-gray-50/50 transition">
                    <td class="p-4 font-bold text-gray-900">#${order.id_web_order}</td>
                    <td class="p-4">
                        <div class="font-bold text-gray-900">${order.client_name || 'بدون اسم'}</div>
                        <div class="text-emerald-600 dir-ltr text-xs font-semibold">📱 ${order.client_phone || '-'}</div>
                        <div class="text-gray-500 text-xs dir-ltr">📞 ${order.client_second_phone || '-'}</div>
                    </td>
                    <td class="p-4 text-xs font-medium text-gray-600">${order.client_address || 'لم يحدد'}</td>
                    <td class="p-4 font-extrabold text-blue-600">${total} ج.س</td>
                    <td class="p-4 text-xs text-gray-400 dir-ltr">${date}</td>
                    <td class="p-4">
                        <div class="flex items-center justify-center gap-2">
                            <button onclick="openInvoiceModal(${order.id_web_order})" class="bg-blue-50 hover:bg-blue-100 text-blue-600 font-bold py-1.5 px-3 rounded-lg text-xs transition">👁️ عرض</button>
