<!DOCTYPE html>

    <script>
        window.tailwind = { config: { suppressDeprecationWarnings: true } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        @media print {
            body * { visibility: hidden; }
            #printableInvoice, #printableInvoice * { visibility: visible; }
            #printableInvoice {
                position: fixed; left: 0; top: 0; width: 100%; height: auto;
                margin: 0; padding: 15px !important; box-shadow: none !important;
                border: none !important; background: white !important;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
