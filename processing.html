<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>صفحة المعالجات - إدارة الطلبات</title>
    <script>
        window.tailwind = { config: { suppressDeprecationWarnings: true } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-100 text-gray-800 p-3 sm:p-6 min-h-screen pb-20">

    <div class="max-w-4xl mx-auto space-y-5">
        
        <!-- شريط العنوان -->
        <div class="flex justify-between items-center bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-gray-200">
            <div>
                <h1 class="text-lg sm:text-2xl font-black text-slate-900">⚙️ صفحة المعالجات</h1>
                <p class="text-xs text-gray-500">معالجة وتعديل بيانات الطلبات والمنتجات المرفقة</p>
            </div>
        </div>

        <!-- البحث عن طلب للمعالجة -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-3">
            <label class="block text-xs font-bold text-slate-700">🔍 أدخل رقم الطلب للمعالجة:</label>
            <div class="flex gap-2">
                <input type="number" id="searchOrderId" placeholder="مثال: 11" class="flex-1 p-2.5 border border-gray-300 rounded-xl text-sm font-bold bg-white focus:ring-2 focus:ring-blue-500">
                <button onclick="loadOrderForProcessing()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-5 rounded-xl text-xs transition shadow-sm">
                    جلب البيانات
                </button>
            </div>
        </div>

        <!-- منطقة معالجة البيانات -->
        <div id="processingArea" class="hidden space-y-4">

            <!-- 1. تعديل بيانات العميل الأساسية -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-3">
                <h3 class="font-bold text-sm text-slate-900 border-b border-gray-100 pb-2">👤 تعديل بيانات العميل (طلب رقم <span id="currentOrderIdDisplay" class="text-blue-600"></span>)</h3>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold text-gray-600 mb-1">اسم العميل:</label>
                        <input type="text" id="procClientName" class="w-full p-2 border border-gray-300 rounded-lg text-xs font-bold bg-white">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-600 mb-1">الهاتف الأساسي:</label>
                        <input type="text" id="procClientPhone" class="w-full p-2 border border-gray-300 rounded-lg text-xs font-bold dir-ltr text-right bg-white">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-600 mb-1">الهاتف الثانوي:</label>
                        <input type="text" id="procClientSecondPhone" class="w-full p-2 border border-gray-300 rounded-lg text-xs font-bold dir-ltr text-right bg-white">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-600 mb-1">العنوان:</label>
                        <input type="text" id="procClientAddress" class="w-full p-2 border border-gray-300 rounded-lg text-xs font-bold bg-white">
                    </div>
                </div>
            </div>

            <!-- 2. معالجة منتجات الطلب -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-3">
                <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                    <h3 class="font-bold text-sm text-slate-900">🛍️ منتجات الطلب</h3>
                    <button onclick="addProductRow()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1.5 rounded-lg border border-indigo-200 transition">
                        ➕ إضافة منتج جديد
                    </button>
                </div>

                <div id="productsList" class="space-y-2"></div>

                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-200 mt-3">
                    <span class="font-bold text-slate-700 text-xs">إجمالي الطلب المعالج:</span>
                    <span id="computedTotal" class="font-black text-emerald-600 text-base">0.00 ج.س</span>
                </div>
            </div>

            <!-- زر حفظ التعديلات والمعالجة -->
            <div class="flex justify-end pt-2">
                <button id="saveProcBtn" onclick="saveProcessingData()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-xl text-xs transition shadow-md w-full sm:w-auto">
                    💾 تنفيذ المعالجة وحفظ البيانات
                </button>
            </div>

        </div>

    </div>

    <script>
        const SUPABASE_URL = "https://ihlwkwiimimoiplfqcdk.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Yr8COAP3Hp_cibgD1wdQZg_Ic9zZEoK"; 

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let activeOrder = null;
        let activeDetails = [];

        // جلب بيانات الطلب والمنتجات للمعالجة
        async function loadOrderForProcessing() {
            const orderId = document.getElementById('searchOrderId').value;
            if (!orderId) {
                alert("يرجى إدخال رقم الطلب أولاً");
                return;
            }

            try {
                // 1. جلب بيانات الطلب الرئيسي
                const { data: orderData, error: orderErr } = await supabaseClient
                    .from('web_orders')
                    .select('*')
                    .eq('id_web_order', orderId)
                    .single();

                if (orderErr || !orderData) {
                    alert("لم يتم العثور على طلب بهذا الرقم.");
                    return;
                }

                activeOrder = orderData;

                // 2. جلب التفاصيل المرفقة بالطلب
                const { data: detailsData } = await supabaseClient
                    .from('web_order_details')
                    .select('*')
                    .eq('id_web_order', orderId);

                activeDetails = detailsData || [];

                // عرض البيانات في واجهة المعالجة
                document.getElementById('currentOrderIdDisplay').textContent = activeOrder.id_web_order;
                document.getElementById('procClientName').value = activeOrder.client_name || '';
                document.getElementById('procClientPhone').value = activeOrder.client_phone || '';
                document.getElementById('procClientSecondPhone').value = activeOrder.client_second_phone || '';
                document.getElementById('procClientAddress').value = activeOrder.client_address || '';

                renderProductsTable();
                document.getElementById('processingArea').classList.remove('hidden');

            } catch (e) {
                alert("حدث خطأ أثناء جلب البيانات: " + e.message);
            }
        }

        // عرض قائمة المنتجات
        function renderProductsTable() {
            const container = document.getElementById('productsList');
            let sum = 0;

            if (activeDetails.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 text-xs py-3 border border-dashed rounded-xl">لا توجد منتجات مسجلة لهذا الطلب</p>`;
            } else {
                let html = '';
                activeDetails.forEach((item, index) => {
                    const rowAmount = (Number(item.qte) || 0) * (Number(item.price) || 0);
                    item.amount = rowAmount;
                    sum += rowAmount;

                    html += `
                    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                        <div class="flex-1">
                            <label class="block text-[10px] font-bold text-gray-500 mb-0.5">اسم المنتج</label>
                            <input type="text" value="${item.product_name || ''}" 
                                oninput="updateItem(${index}, 'product_name', this.value)"
                                class="w-full p-1.5 border border-gray-300 rounded-lg text-xs font-bold bg-white">
                        </div>
                        <div class="w-20">
                            <label class="block text-[10px] font-bold text-gray-500 mb-0.5">الكمية</label>
                            <input type="number" min="1" value="${item.qte || 1}" 
                                oninput="updateItem(${index}, 'qte', this.value)"
                                class="w-full p-1.5 border border-gray-300 rounded-lg text-xs font-bold text-center bg-white">
                        </div>
                        <div class="w-24">
                            <label class="block text-[10px] font-bold text-gray-500 mb-0.5">السعر</label>
                            <input type="number" min="0" step="0.01" value="${item.price || 0}" 
                                oninput="updateItem(${index}, 'price', this.value)"
                                class="w-full p-1.5 border border-gray-300 rounded-lg text-xs font-bold text-center bg-white">
                        </div>
                        <div class="w-24 text-center sm:text-right">
                            <span class="block text-[10px] font-bold text-gray-400">المجموع</span>
                            <span class="text-xs font-black text-blue-600">${rowAmount.toFixed(2)}</span>
                        </div>
                        <div class="flex items-center justify-center pt-1 sm:pt-3">
                            <button onclick="removeItem(${index})" class="text-rose-600 hover:bg-rose-100 p-1.5 rounded-lg text-xs transition">
                                🗑️
                            </button>
                        </div>
                    </div>`;
                });
                container.innerHTML = html;
            }

            activeOrder.total_amount = sum;
            document.getElementById('computedTotal').textContent = sum.toFixed(2) + ' ج.س';
        }

        function updateItem(index, prop, val) {
            if (!activeDetails[index]) return;
            activeDetails[index][prop] = (prop === 'qte' || prop === 'price') ? (Number(val) || 0) : val;
            renderProductsTable();
        }

        function addProductRow() {
            activeDetails.push({ product_name: "منتج جديد", qte: 1, price: 0, amount: 0 });
            renderProductsTable();
        }

        function removeItem(index) {
            activeDetails.splice(index, 1);
            renderProductsTable();
        }

        // حفظ المعالجة مباشرة في قاعدة البيانات
        async function saveProcessingData() {
            if (!activeOrder) return;

            const btn = document.getElementById('saveProcBtn');
            btn.disabled = true;
            btn.textContent = 'جاري الحفظ والمعالجة...';

            const payload = {
                client_name: document.getElementById('procClientName').value || null,
                client_phone: document.getElementById('procClientPhone').value || null,
                client_second_phone: document.getElementById('procClientSecondPhone').value || null,
                client_address: document.getElementById('procClientAddress').value || null,
                total_amount: activeOrder.total_amount || 0
            };

            try {
                // 1. تحديث جدول web_orders
                const { error: err1 } = await supabaseClient
                    .from('web_orders')
                    .update(payload)
                    .eq('id_web_order', activeOrder.id_web_order);

                if (err1) throw err1;

                // 2. تحديث جدول web_order_details
                await supabaseClient
                    .from('web_order_details')
                    .delete()
                    .eq('id_web_order', activeOrder.id_web_order);

                if (activeDetails.length > 0) {
                    const rowsToInsert = activeDetails.map(item => ({
                        id_web_order: activeOrder.id_web_order,
                        product_name: item.product_name || 'منتج',
                        qte: Number(item.qte) || 1,
                        price: Number(item.price) || 0,
                        amount: Number(item.amount) || 0
                    }));

                    const { error: err2 } = await supabaseClient
                        .from('web_order_details')
                        .insert(rowsToInsert);

                    if (err2) throw err2;
                }

                alert('✅ تم حفظ المعالجة وتحديث البيانات بنجاح');

            } catch (e) {
                alert('❌ حدث خطأ أثناء المعالجة: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '💾 تنفيذ المعالجة وحفظ البيانات';
            }
        }
    </script>
</body>
</html>
