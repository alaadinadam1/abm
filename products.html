<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المنتجات</title>

<!-- استدعاء مكتبة Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Tahoma, sans-serif;
background:#f4f6f9;
padding:10px;
}

.container{
max-width:1100px;
margin:auto;
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
text-align:center;
font-size:20px;
}

.grid{
display:grid;
grid-template-columns:1fr;
gap:10px;
}

/* للشاشات الكبيرة */
@media(min-width:768px){
.grid{
grid-template-columns:repeat(3,1fr);
}
}

input,select{
padding:10px;
border:1px solid #ccc;
border-radius:5px;
width:100%;
font-size:14px;
box-sizing: border-box;
}

.file-input-wrapper {
grid-column: span 1;
display: flex;
flex-direction: column;
gap: 5px;
}

@media(min-width:768px){
.file-input-wrapper {
grid-column: span 3;
}
}

.img-preview {
width: 60px;
hight: 60px;
object-fit: cover;
border-radius: 5px;
border: 1px solid #ddd;
}

button{
padding:10px;
border:none;
border-radius:5px;
cursor:pointer;
font-size:14px;
width:100%;
margin-top:5px;
}

/* للشاشات الكبيرة */
@media(min-width:768px){
button{
width:auto;
}
}

.save{background:#28a745;color:white}
.edit{background:#ffc107}
.delete{background:#dc3545;color:white}
.logout{background:#333;color:white;float:none;margin-bottom:10px}

/* للشاشات الكبيرة */
@media(min-width:768px){
.logout{float:left}
}

.table-container{
overflow-x:auto;
}

table{
min-width:700px;
width:100%;
margin-top:20px;
border-collapse:collapse;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
font-size:13px;
vertical-align: middle;
}

th{
background:#007bff;
color:white;
}

</style>

</head>

<body>

<div class="container">

<button class="logout" onclick="logout()">خروج</button>

<h2>إدارة المنتجات</h2>

<input type="text" id="searchBox" placeholder="بحث عن منتج..." onkeyup="searchProduct()">

<br><br>

<div class="grid">

<input id="product_name" placeholder="اسم المنتج">

<input id="pay_qte" type="number" placeholder="كمية الشراء">

<input id="pice_qte" type="number" placeholder="عدد القطع">

<input id="qte_in_stock" type="number" placeholder="المخزون">

<input id="pay_price" type="number" placeholder="سعر الشراء">

<input id="seal_price" type="number" placeholder="سعر البيع">

<input id="pay_date" type="date">

<input id="expare_date" type="date">

<input id="req_id" placeholder="رقم الطلب">

<input id="coasts_value" type="number" placeholder="التكاليف">

<select id="id_cat">
  <option value="">اختر الصنف...</option>
</select>

<input id="department" placeholder="القسم">

<!-- إدخال ومعاينة الصورة -->
<div class="file-input-wrapper">
  <label style="font-size: 12px; font-weight: bold; color: #555;">صورة المنتج:</label>
  <div style="display: flex; gap: 10px; align-items: center;">
      <input type="file" id="image_file" accept="image/*" onchange="previewImage(event)">
      <img id="image_preview" src="" style="display:none; width: 50px; height: 50px; border-radius: 5px; object-fit: cover;">
  </div>
</div>

</div>

<br>

<button class="save" id="btnSave" onclick="saveProduct()">حفظ المنتج</button>

<div class="table-container">
<table>

<thead>
<tr>
<th>ID</th>
<th>الصورة</th>
<th>المنتج</th>
<th>المخزون</th>
<th>سعر البيع</th>
<th>الصنف</th>
<th>تعديل</th>
<th>حذف</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>
</div>

</div>

<script>
// إعداد عميل Supabase
const supabaseUrl = "https://ihlwkwiimimoiplfqcdk.supabase.co";
const supabaseKey = "sb_publishable_Yr8COAP3Hp_cibgD1wdQZg_Ic9zZEoK";
const client = window.supabase.createClient(supabaseUrl, supabaseKey);

let edit_id = null;
let products = [];
let categories = []; 
let currentBase64Image = null;

// تحويل ملف الصورة إلى نص Base64
function convertFileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
}

// معاينة الصورة المختارة
async function previewImage(event) {
    const file = event.target.files[0];
    const preview = document.getElementById("image_preview");
    if (file) {
        currentBase64Image = await convertFileToBase64(file);
        preview.src = currentBase64Image;
        preview.style.display = "block";
    }
}

// 1. تحميل الأصناف من Supabase
async function loadCategories(){
    try {
        const { data, error } = await client.from("categories").select("*");
        if (error) throw error;

        categories = data || [];

        let html = `<option value="">اختر الصنف...</option>`;
        categories.forEach(c => {
            html += `<option value="${c.id_cat}">${c.description_cat || c.name_cat || ('صنف ' + c.id_cat)}</option>`;
        });

        document.getElementById("id_cat").innerHTML = html;
    } catch (err) {
        console.error("خطأ في تحميل الأصناف:", err.message);
    }
}

// 2. تحميل المنتجات من Supabase
async function loadProducts(){
    try {
        const { data, error } = await client.from("products").select("*").order("id_product", { ascending: false });
        if (error) throw error;

        products = data || [];
        renderTable(products);
    } catch (err) {
        console.error("خطأ في تحميل المنتجات:", err.message);
    }
}

// 3. عرض جدول المنتجات
function renderTable(list){
    let html = "";
    const fallbackImg = "https://images.unsplash.com/photo-1479064555552-3ef4979f8908?q=80&w=100";

    list.forEach(p => {
        const catObj = categories.find(c => c.id_cat == p.id_cat);
        const catName = catObj ? (catObj.description_cat || catObj.name_cat) : (p.id_cat || "غير محدد");
        const imgSrc = (p.image_product && typeof p.image_product === 'string') ? p.image_product : fallbackImg;

        html += `
        <tr>
        <td>${p.id_product}</td>
        <td><img src="${imgSrc}" class="img-preview" onerror="this.src='${fallbackImg}'"></td>
        <td>${p.product_name || ""}</td>
        <td>${p.qte_in_stock || 0}</td>
        <td>${p.seal_price || 0}</td>
        <td>${catName}</td>
        <td><button class="edit" onclick="editProduct(${p.id_product})">تعديل</button></td>
        <td><button class="delete" onclick="deleteProduct(${p.id_product})">حذف</button></td>
        </tr>`;
    });
    document.getElementById("tableBody").innerHTML = html;
}

// 4. حفظ أو تعديل المنتج في Supabase
async function saveProduct(){
    const btn = document.getElementById("btnSave");
    btn.disabled = true;
    btn.innerText = "جاري الحفظ...";

    let payQte = Number(document.getElementById("pay_qte").value) || 0;
    let piceQte = Number(document.getElementById("pice_qte").value) || 0;
    
    let stockInput = document.getElementById("qte_in_stock").value;
    let stockCalculated = stockInput !== "" ? Number(stockInput) : (payQte * piceQte);

    let catVal = document.getElementById("id_cat").value;

    let payload = {
        product_name: document.getElementById("product_name").value || null,
        pay_qte: payQte,
        pice_qte: piceQte,
        qte_in_stock: stockCalculated,
        pay_price: Number(document.getElementById("pay_price").value) || 0,
        seal_price: Number(document.getElementById("seal_price").value) || 0,
        pay_date: document.getElementById("pay_date").value || null,
        expare_date: document.getElementById("expare_date").value || null,
        req_id: document.getElementById("req_id").value || null,
        coasts_value: Number(document.getElementById("coasts_value").value) || 0,
        id_cat: catVal ? Number(catVal) : null,
        department: document.getElementById("department").value || null
    };

    // إضافة الصورة للحمولة فقط في حال تم تحديد صورة جديدة
    if (currentBase64Image) {
        payload.image_product = currentBase64Image;
    }

    try {
        let error;
        if(edit_id == null){
            // إضافة منتج جديد
            const res = await client.from("products").insert([payload]);
            error = res.error;
        } else {
            // تحديث منتج موجود
            const res = await client.from("products").update(payload).eq("id_product", edit_id);
            error = res.error;
            edit_id = null;
        }

        if(error) throw error;

        alert("تم الحفظ بنجاح");
        clearForm();
        loadProducts();
    } catch(err) {
        alert("خطأ أثناء الحفظ: " + err.message);
    } finally {
        btn.disabled = false;
        btn.innerText = "حفظ المنتج";
    }
}

// 5. تعبئة النموذج للتعديل
function editProduct(id){
    let p = products.find(x => x.id_product == id);
    if(!p) return;

    document.getElementById("product_name").value = p.product_name || "";
    document.getElementById("pay_qte").value = p.pay_qte || "";
    document.getElementById("pice_qte").value = p.pice_qte || "";
    document.getElementById("qte_in_stock").value = p.qte_in_stock || "";
    document.getElementById("pay_price").value = p.pay_price || "";
    document.getElementById("seal_price").value = p.seal_price || "";
    
    if(p.pay_date) document.getElementById("pay_date").value = p.pay_date.split('T')[0];
    if(p.expare_date) document.getElementById("expare_date").value = p.expare_date.split('T')[0];
    
    document.getElementById("req_id").value = p.req_id || "";
    document.getElementById("coasts_value").value = p.coasts_value || "";
    document.getElementById("id_cat").value = p.id_cat || "";
    document.getElementById("department").value = p.department || "";

    // عرض معاينة الصورة المحفوظة مسبقاً
    const preview = document.getElementById("image_preview");
    if (p.image_product && typeof p.image_product === 'string') {
        preview.src = p.image_product;
        preview.style.display = "block";
        currentBase64Image = p.image_product;
    } else {
        preview.style.display = "none";
        currentBase64Image = null;
    }

    edit_id = id;
}

// 6. حذف منتج
async function deleteProduct(id){
    if(!confirm("هل أنت تأكد من عملية الحذف؟")) return;
    try {
        const { error } = await client.from("products").delete().eq("id_product", id);
        if(error) throw error;

        loadProducts();
    } catch (err) {
        alert("خطأ عند الحذف: " + err.message);
    }
}

// 7. بحث في المنتجات
function searchProduct(){
    let word = document.getElementById("searchBox").value.toLowerCase();
    let filtered = products.filter(p =>
        (p.product_name || "").toLowerCase().includes(word)
    );
    renderTable(filtered);
}

// 8. تفريغ الحقول
function clearForm(){
    document.querySelectorAll(".grid input").forEach(i => i.value = "");
    document.getElementById("id_cat").value = "";
    document.getElementById("image_file").value = "";
    document.getElementById("image_preview").style.display = "none";
    currentBase64Image = null;
    edit_id = null;
}

// 9. تسجيل الخروج
function logout(){
    window.location.href = "index.html";
}

// البدء
async function init() {
    await loadCategories();
    await loadProducts();
}

init();

</script>

</body>
</html>
