<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المنتجات</title>

    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #f4f6f9;
            padding: 10px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            font-size: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        /* للشاشات الكبيرة */
        @media(min-width:768px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 100%;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-top: 5px;
        }

        /* للشاشات الكبيرة */
        @media(min-width:768px) {
            button {
                width: auto;
            }
        }

        .save { background: #28a745; color: white; }
        .edit { background: #ffc107; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
        .delete { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
        .logout { background: #333; color: white; float: none; margin-bottom: 10px; }

        /* للشاشات الكبيرة */
        @media(min-width:768px) {
            .logout { float: left; }
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            min-width: 600px;
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
            font-size: 13px;
        }

        th {
            background: #007bff;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <button class="logout" onclick="logout()">خروج</button>

    <h2>إدارة المنتجات</h2>

    <input type="text" id="searchBox" placeholder="بحث عن منتج أو صنف..." onkeyup="searchProduct()">

    <br><br>

    <div class="grid">
        <input id="product_name" placeholder="اسم المنتج *">
        <input id="pay_qte" type="number" placeholder="كمية الشراء" oninput="autoCalculateStock()">
        <input id="pice_qte" type="number" placeholder="عدد القطع" oninput="autoCalculateStock()">
        <input id="qte_in_stock" type="number" placeholder="المخزون">
        <input id="pay_price" type="number" step="0.01" placeholder="سعر الشراء">
        <input id="seal_price" type="number" step="0.01" placeholder="سعر البيع *">
        
        <div>
            <label style="font-size: 11px; color: #666; display: block; margin-bottom: 2px;">تاريخ الشراء:</label>
            <input id="pay_date" type="date">
        </div>
        
        <div>
            <label style="font-size: 11px; color: #666; display: block; margin-bottom: 2px;">تاريخ انتهاء الصلاحية:</label>
            <input id="expare_date" type="date">
        </div>

        <input id="req_id" placeholder="رقم الطلب">
        <input id="coasts_value" type="number" step="0.01" placeholder="التكاليف">
        
        <select id="id_cat">
            <option value="">جاري تحميل الأصناف...</option>
        </select>
        
        <input id="p_weight" placeholder="الوزن">
    </div>

    <br>

    <div style="display: flex; gap: 10px;">
        <button class="save" id="btnSave" onclick="saveProduct()">حفظ المنتج</button>
        <button type="button" onclick="clearForm()" style="background: #6c757d; color: white;">إلغاء / مسح الحقول</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>المنتج</th>
                    <th>المخزون</th>
                    <th>سعر البيع</th>
                    <th>الصنف</th>
                    <th>تعديل</th>
                    <th>حذف</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="7">جاري تحميل البيانات...</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script>
    let edit_id = null;
    let products = [];
    let categories = [];

    // 1. حساب المخزون تلقائياً عند تغيير كمية الشراء وعدد القطع
    function autoCalculateStock() {
        const payQte = Number(document.getElementById("pay_qte").value) || 0;
        const piceQte = Number(document.getElementById("pice_qte").value) || 0;
        if (payQte > 0 && piceQte > 0) {
            document.getElementById("qte_in_stock").value = payQte * piceQte;
        }
    }

    // 2. تحميل الأصناف من السيرفر المحلي
    async function loadCategories() {
        try {
            const response = await fetch('/api/categories');
            if (!response.ok) throw new Error("فشل في تحميل الأصناف");
            categories = await response.json();

            let html = '<option value="">اختر الصنف...</option>';
            categories.forEach(c => {
                const catName = c.description_cat || c.name_cat || ('صنف ' + c.id_cat);
                html += `<option value="${c.id_cat}">${catName}</option>`;
            });

            document.getElementById("id_cat").innerHTML = html;
        } catch (err) {
            console.error("خطأ في تحميل الأصناف:", err);
            document.getElementById("id_cat").innerHTML = '<option value="">تعذر تحميل الأصناف</option>';
        }
    }

    // 3. تحميل المنتجات من السيرفر المحلي
    async function loadProducts() {
        try {
            const response = await fetch('/api/products');
            if (!response.ok) throw new Error("فشل في جلب المنتجات");
            products = await response.json();
            renderTable(products);
        } catch (err) {
            console.error("خطأ في تحميل المنتجات:", err);
            document.getElementById("tableBody").innerHTML = `<tr><td colspan="7" style="color:red;">خطأ أثناء تحميل المنتجات: ${err.message}</td></tr>`;
        }
    }

    // 4. عرض جدول المنتجات
    function renderTable(list) {
        if (!list || list.length === 0) {
            document.getElementById("tableBody").innerHTML = `<tr><td colspan="7">لا توجد منتجات مسجلة.</td></tr>`;
            return;
        }

        let html = "";
        list.forEach(p => {
            const catObj = categories.find(c => c.id_cat == p.id_cat);
            const catName = catObj ? (catObj.description_cat || catObj.name_cat) : (p.id_cat || 'غير محدد');

            html += `
            <tr>
                <td>${p.id_product}</td>
                <td><strong>${p.product_name || 'بدون اسم'}</strong></td>
                <td>${p.qte_in_stock || 0}</td>
                <td>${Number(p.seal_price || 0).toFixed(2)}</td>
                <td>${catName}</td>
                <td><button class="edit" onclick="editProduct(${p.id_product})">تعديل</button></td>
                <td><button class="delete" onclick="deleteProduct(${p.id_product})">حذف</button></td>
            </tr>`;
        });
        document.getElementById("tableBody").innerHTML = html;
    }

    // 5. حفظ أو تعديل المنتج عبر الخادم المحلي
    async function saveProduct() {
        const productName = document.getElementById("product_name").value.trim();
        if (!productName) {
            alert("يرجى إدخال اسم المنتج");
            return;
        }

        let payQte = Number(document.getElementById("pay_qte").value) || 0;
        let piceQte = Number(document.getElementById("pice_qte").value) || 0;
        let stockInput = Number(document.getElementById("qte_in_stock").value);
        let stockCalculated = (stockInput || stockInput === 0) ? stockInput : (payQte * piceQte);

        let data = {
            product_name: productName,
            pay_qte: payQte,
            pice_qte: piceQte,
            qte_in_stock: stockCalculated,
            pay_price: Number(document.getElementById("pay_price").value) || 0,
            seal_price: Number(document.getElementById("seal_price").value) || 0,
            pay_date: document.getElementById("pay_date").value || null,
            expare_date: document.getElementById("expare_date").value || null,
            req_id: document.getElementById("req_id").value || null,
            coasts_value: Number(document.getElementById("coasts_value").value) || 0,
            id_cat: Number(document.getElementById("id_cat").value) || null,
            p_weight: document.getElementById("p_weight").value || null
        };

        try {
            let response;
            if (edit_id == null) {
                // إضافة جديد
                response = await fetch('/api/products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            } else {
                // تحديث
                response = await fetch(`/api/products/${edit_id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            }

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error || "فشل حفظ البيانات");
            }

            alert(edit_id ? "تم تعديل المنتج بنجاح!" : "تم حفظ المنتج بنجاح!");
            clearForm();
            loadProducts();
        } catch (err) {
            alert("خطأ: " + err.message);
        }
    }

    // 6. تعبئة النموذج للتعديل
    function editProduct(id) {
        let p = products.find(x => x.id_product == id);
        if (!p) return;

        document.getElementById("product_name").value = p.product_name || "";
        document.getElementById("pay_qte").value = p.pay_qte || "";
        document.getElementById("pice_qte").value = p.pice_qte || "";
        document.getElementById("qte_in_stock").value = p.qte_in_stock || 0;
        document.getElementById("pay_price").value = p.pay_price || "";
        document.getElementById("seal_price").value = p.seal_price || "";

        if (p.pay_date) document.getElementById("pay_date").value = p.pay_date.split('T')[0];
        else document.getElementById("pay_date").value = "";

        if (p.expare_date) document.getElementById("expare_date").value = p.expare_date.split('T')[0];
        else document.getElementById("expare_date").value = "";

        document.getElementById("req_id").value = p.req_id || "";
        document.getElementById("coasts_value").value = p.coasts_value || "";
        document.getElementById("id_cat").value = p.id_cat || "";
        document.getElementById("p_weight").value = p.p_weight || "";

        edit_id = id;
        document.getElementById("btnSave").textContent = "تحديث البيانات";
        document.getElementById("btnSave").style.background = "#ffc107";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 7. حذف منتج
    async function deleteProduct(id) {
        if (!confirm(`هل انت تأكد من حذف المنتج رقم #${id}؟`)) return;

        try {
            const response = await fetch(`/api/products/${id}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                alert("تم الحذف بنجاح");
                loadProducts();
            } else {
                alert("فشل حذف المنتج من الخادم المحلي");
            }
        } catch (err) {
            alert("خطأ عند الحذف: " + err.message);
        }
    }

    // 8. بحث عن منتج
    function searchProduct() {
        let word = document.getElementById("searchBox").value.toLowerCase().trim();
        let filtered = products.filter(p => {
            const catObj = categories.find(c => c.id_cat == p.id_cat);
            const catName = catObj ? (catObj.description_cat || catObj.name_cat || '') : '';
            
            return (
                (p.product_name && p.product_name.toLowerCase().includes(word)) ||
                catName.toLowerCase().includes(word) ||
                (p.id_product && p.id_product.toString().includes(word))
            );
        });
        renderTable(filtered);
    }

    // 9. مسح الحقول
    function clearForm() {
        document.querySelectorAll(".grid input").forEach(i => i.value = "");
        document.getElementById("id_cat").value = "";
        edit_id = null;
        document.getElementById("btnSave").textContent = "حفظ المنتج";
        document.getElementById("btnSave").style.background = "#28a745";
    }

    // 10. تسجيل خروج
    function logout() {
        window.location.href = "index.html";
    }

    // البدء بالتحميل
    async function init() {
        await loadCategories();
        await loadProducts();
    }

    init();
</script>

</body>
</html>
