<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المنتجات - لوحة التحكم</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 p-4 md:p-8 min-h-screen">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- الشريط العلوي والإحصائيات -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
            <div>
                <h1 class="text-2xl font-black text-gray-900">📦 إدارة المخزون والمنتجات</h1>
                <p class="text-xs text-gray-500 mt-1">إضافة، تعديل، وحذف المنتجات المتاحة في المتجر</p>
            </div>
            
            <div class="flex items-center gap-3 w-full md:w-auto">
                <button onclick="openProductModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-5 rounded-xl text-xs transition flex items-center gap-2 shadow-sm">
                    ➕ إضافة منتج جديد
                </button>
                <button onclick="fetchProducts()" class="bg-gray-900 hover:bg-gray-800 text-white font-bold py-2.5 px-4 rounded-xl text-xs transition flex items-center gap-2 shadow-sm">
                    🔄 تحديث
                </button>
            </div>
        </div>

        <!-- شريط البحث والفرز -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex justify-between items-center">
            <div class="w-full md:w-96">
                <input type="text" id="searchInput" oninput="filterProducts()" placeholder="🔍 ابحث عن اسم المنتج أو القسم..." class="w-full border rounded-xl p-2.5 text-xs bg-gray-50 outline-none focus:ring-2 focus:ring-blue-400">
            </div>
            <div class="text-xs font-bold text-gray-500">
                إجمالي المنتجات: <span id="productsCount" class="text-blue-600 font-extrabold">0</span>
            </div>
        </div>

        <!-- جدول المنتجات -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse text-xs md:text-sm">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-100 text-gray-500 font-bold">
                            <th class="p-4">المنتج</th>
                            <th class="p-4">القسم</th>
                            <th class="p-4">سعر البيع</th>
                            <th class="p-4">سعر التكلفة</th>
                            <th class="p-4">العمولة</th>
                            <th class="p-4">المخزون</th>
                            <th class="p-4 text-center">الخيارات</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody">
                        <tr>
                            <td colspan="7" class="text-center p-8 text-gray-400">جاري تحميل المنتجات...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- النافذة المنبثقة لإضافة/تعديل منتج Modal -->
    <div id="productModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white w-full max-w-xl rounded-3xl shadow-2xl overflow-hidden my-6 relative flex flex-col border border-gray-100 animate-in fade-in zoom-in duration-200">
            
            <div class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center">
                <h3 id="modalTitle" class="font-bold text-sm">إضافة منتج جديد</h3>
                <button onclick="closeProductModal()" class="w-7 h-7 rounded-full bg-slate-800 hover:bg-slate-700 text-gray-300 flex items-center justify-center font-bold text-sm">✕</button>
            </div>

            <form id="productForm" onsubmit="saveProduct(event)" class="p-6 space-y-4">
                <input type="hidden" id="productId">

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">اسم المنتج *</label>
                    <input type="text" id="productName" required class="w-full border rounded-xl p-2.5 text-xs outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">سعر البيع (seal_price) *</label>
                        <input type="number" step="0.01" id="sealPrice" required class="w-full border rounded-xl p-2.5 text-xs outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">سعر الشراء / التكلفة (pay_price)</label>
                        <input type="number" step="0.01" id="payPrice" class="w-full border rounded-xl p-2.5 text-xs outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">الكمية بالخزينة *</label>
                        <input type="number" id="qteInStock" required class="w-full border rounded-xl p-2.5 text-xs outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">العمولة (commission)</label>
                        <input type="number" step="0.01" id="commission" class="w-full border rounded-xl p-2.5 text-xs outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">القسم (department)</label>
                        <input type="text" id="department" placeholder="مثال: رجالي، نسائي" class="w-full border rounded-xl p-2.5 text-xs outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">رابط الصورة (image_url)</label>
                    <input type="url" id="imageUrl" placeholder="https://example.com/image.jpg" class="w-full border rounded-xl p-2.5 text-xs outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 dir-ltr">
                </div>

                <div class="flex justify-end gap-2 pt-4 border-t border-gray-100">
                    <button type="button" onclick="closeProductModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2.5 px-5 rounded-xl text-xs transition">
                        إلغاء
                    </button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-6 rounded-xl text-xs transition shadow-sm">
                        حفظ البيانات
                    </button>
                </div>
            </form>

        </div>
    </div>

    <script>
        const supabaseClient = supabase.createClient(
            "https://ihlwkwiimimoiplfqcdk.supabase.co",
            "sb_publishable_Yr8COAP3Hp_cibgD1wdQZg_Ic9zZEoK"
        );

        let productsList = [];
        let filteredProductsList = [];

        // 1. جلب المنتجات من Supabase
        async function fetchProducts() {
            try {
                const { data, error } = await supabaseClient
                    .from("products")
                    .select("*")
                    .order("id_product", { ascending: false });

                if (error) throw error;

                productsList = data || [];
                filteredProductsList = productsList;
                renderProducts(filteredProductsList);
            } catch (err) {
                console.error("خطأ في جلب البيانات:", err);
                alert("تعذر جلب المنتجات: " + err.message);
            }
        }

        // 2. رسم المنتجات داخل الجدول
        function renderProducts(items) {
            const tbody = document.getElementById("productsTableBody");
            document.getElementById("productsCount").textContent = items.length;

            if (!items || items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center p-8 text-gray-400">لا توجد منتجات مسجلة.</td></tr>`;
                return;
            }

            let html = "";
            const fallbackImg = "https://placehold.co/100x100?text=No+Image";

            items.forEach(p => {
                const img = p.image_url ? p.image_url : fallbackImg;
                
                html += `
                <tr class="border-b border-gray-100 hover:bg-gray-50/50 transition">
                    <td class="p-4">
                        <div class="flex items-center gap-3">
                            <img src="${img}" alt="${p.product_name}" class="w-10 h-10 object-cover rounded-xl border border-gray-200 bg-gray-50 flex-shrink-0" onerror="this.src='${fallbackImg}'">
                            <div>
                                <div class="font-bold text-gray-900">${p.product_name || 'بدون اسم'}</div>
                                <div class="text-[10px] text-gray-400">ID: #${p.id_product}</div>
                            </div>
                        </div>
                    </td>
                    <td class="p-4 text-xs font-semibold text-gray-600">${p.department || 'عام'}</td>
                    <td class="p-4 font-extrabold text-blue-600">${Number(p.seal_price || 0).toFixed(2)} ج.س</td>
                    <td class="p-4 text-gray-500 font-medium">${Number(p.pay_price || 0).toFixed(2)} ج.س</td>
                    <td class="p-4 text-gray-500 font-medium">${Number(p.commission || 0).toFixed(2)} ج.س</td>
                    <td class="p-4 font-bold ${p.qte_in_stock > 5 ? 'text-emerald-600' : 'text-rose-600'}">
                        ${p.qte_in_stock || 0}
                    </td>
                    <td class="p-4 text-center">
                        <div class="flex items-center justify-center gap-2">
                            <button onclick="editProduct(${p.id_product})" class="bg-blue-50 hover:bg-blue-100 text-blue-600 font-bold py-1.5 px-3 rounded-lg text-xs transition">
                                ✏️ تعديل
                            </button>
                            <button onclick="deleteProduct(${p.id_product})" class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold py-1.5 px-3 rounded-lg text-xs transition">
                                🗑️ حذف
                            </button>
                        </div>
                    </td>
                </tr>`;
            });

            tbody.innerHTML = html;
        }

        // 3. تصفية المنتجات عند البحث
        function filterProducts() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            filteredProductsList = productsList.filter(p => 
                (p.product_name && p.product_name.toLowerCase().includes(query)) ||
                (p.department && p.department.toLowerCase().includes(query))
            );
            renderProducts(filteredProductsList);
        }

        // 4. فتح نموذج الإضافة/التعديل
        function openProductModal(product = null) {
            document.getElementById("productForm").reset();
            if (product) {
                document.getElementById("modalTitle").textContent = "تعديل بيانات المنتج #" + product.id_product;
                document.getElementById("productId").value = product.id_product;
                document.getElementById("productName").value = product.product_name || "";
                document.getElementById("sealPrice").value = product.seal_price || 0;
                document.getElementById("payPrice").value = product.pay_price || 0;
                document.getElementById("qteInStock").value = product.qte_in_stock || 0;
                document.getElementById("commission").value = product.commission || 0;
                document.getElementById("department").value = product.department || "";
                document.getElementById("imageUrl").value = product.image_url || "";
            } else {
                document.getElementById("modalTitle").textContent = "إضافة منتج جديد";
                document.getElementById("productId").value = "";
            }
            document.getElementById("productModal").classList.remove("hidden");
        }

        function closeProductModal() {
            document.getElementById("productModal").classList.add("hidden");
        }

        function editProduct(id) {
            const product = productsList.find(p => p.id_product === id);
            if (product) openProductModal(product);
        }

        // 5. حفظ المنتج (إضافة أو تعديل)
        async function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById("productId").value;

            const payload = {
                product_name: document.getElementById("productName").value,
                seal_price: parseFloat(document.getElementById("sealPrice").value) || 0,
                pay_price: parseFloat(document.getElementById("payPrice").value) || 0,
                qte_in_stock: parseInt(document.getElementById("qteInStock").value) || 0,
                commission: parseFloat(document.getElementById("commission").value) || 0,
                department: document.getElementById("department").value,
                image_url: document.getElementById("imageUrl").value
            };

            try {
                let error;
                if (id) {
                    // تعديل
                    const res = await supabaseClient.from("products").update(payload).eq("id_product", id);
                    error = res.error;
                } else {
                    // إضافة جديد
                    const res = await supabaseClient.from("products").insert([payload]);
                    error = res.error;
                }

                if (error) throw error;

                alert(id ? "تم تعديل المنتج بنجاح!" : "تمت إضافة المنتج بنجاح!");
                closeProductModal();
                fetchProducts();
            } catch (err) {
                console.error("خطأ أثناء الحفظ:", err);
                alert("فشلت عملية الحفظ: " + err.message);
            }
        }

        // 6. حذف المنتج
        async function deleteProduct(id) {
            if (!confirm(`هل أنت تأكد من حذف المنتج رقم #${id}؟`)) return;

            try {
                const { error } = await supabaseClient.from("products").delete().eq("id_product", id);
                if (error) throw error;

                alert("تم حذف المنتج بنجاح");
                fetchProducts();
            } catch (err) {
                console.error("خطأ الحذف:", err);
                alert("تعذر حذف المنتج: " + err.message);
            }
        }

        window.onload = fetchProducts;
    </script>
</body>
</html>
