<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إدارة الفواتير المعتمدة - النسخة الجديدة</title>
    <script>window.tailwind = { config: { suppressDeprecationWarnings: true } };</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        @media print {
            body * { visibility: hidden; }
            #invoicePrintArea, #invoicePrintArea * { visibility: visible; }
            #invoicePrintArea {
                position: fixed; left: 0; top: 0; width: 100%; height: auto;
                background: white; padding: 20px; box-shadow: none; border: none;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- الهيدر -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-black text-slate-900">📑 الفواتير المعتمدة (النسخة المباشرة)</h1>
                <p class="text-xs text-gray-500 mt-1">عرض الطلبات التي تم اعتمادها وسحب قيمها مباشرة من قاعدة البيانات</p>
            </div>
            <button onclick="fetchDirectApprovedInvoices()" class="bg-slate-900 hover:bg-slate-800 text-white font-bold px-5 py-2.5 rounded-xl text-xs transition shadow-sm">
                🔄 تحديث وسحب البيانات
            </button>
        </div>

        <!-- جدول أو كروت العرض -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse text-sm">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-100 text-gray-500 font-bold">
                            <th class="p-4">رقم الطلب</th>
                            <th class="p-4">العميل والهواتف</th>
                            <th class="p-4">بيانات المسوق والبنك</th>
                            <th class="p-4">العمولة (المسجلة)</th>
                            <th class="p-4">الإجمالي (المسجل)</th>
                            <th class="p-4 text-center">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="directOrdersTable">
                        <tr><td colspan="6" class="text-center p-8 text-gray-400">جاري تحميل الفواتير...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- نافذة معاينة الفاتورة الجاهزة -->
    <div id="directModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-slate-900 text-white p-4 flex justify-between items-center">
                <h3 class="font-bold text-sm">معاينة الفاتورة المباشرة</h3>
                <button onclick="closeDirectModal()" class="w-8 h-8 rounded-full bg-slate-800 text-gray-300 font-bold">✕</button>
            </div>
            
            <div id="invoicePrintArea" class="p-6 overflow-y-auto space-y-4 text-xs bg-white">
                <!-- تفاصيل الفاتورة تحقن هنا -->
            </div>

            <div class="bg-gray-50 border-t p-4 flex justify-between items-center no-print">
                <button onclick="closeDirectModal()" class="bg-gray-200 text-gray-700 font-bold px-4 py-2 rounded-xl">إغلاق</button>
                <div class="flex gap-2">
                    <button onclick="sendWhatsApp()" class="bg-emerald-600 text-white font-bold px-3 py-2 rounded-xl">💬 واتساب</button>
                    <button onclick="window.print()" class="bg-blue-600 text-white font-bold px-3 py-2 rounded-xl">🖨️ طباعة</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ihlwkwiimimoiplfqcdk.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Yr8COAP3Hp_cibgD1wdQZg_Ic9zZEoK"; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let activeInvoiceData = null;

        async function fetchDirectApprovedInvoices() {
            const tableBody = document.getElementById('directOrdersTable');
            tableBody.innerHTML = `<tr><td colspan="6" class="text-center p-8 text-gray-400">جاري السحب من قاعدة البيانات...</td></tr>`;

            try {
                // سحب الطلبات التي تحمل علامة الاعتماد مباشرة
                const { data: orders, error } = await supabase
                    .from('web_orders')
                    .select('*')
                    .eq('is_approved', true)
                    .order('date_created', { ascending: false });

                if (error) throw error;

                if (!orders || orders.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" class="text-center p-8 text-gray-400">لا توجد فواتير معتمدة في قاعدة البيانات حالياً.</td></tr>`;
                    return;
                }

                let html = '';
                orders.forEach(order => {
                    // سحب الحقول كما هي مخزنة تماماً دون أي تعديل أو حسابات برمجية معقدة
                    const orderId = order.id_web_order || order.id || '-';
                    const clientName = order.client_name || 'بدون اسم';
                    const phone1 = order.client_phone || '-';
                    const phone2 = order.client_second_phone || 'لا يوجد';
                    
                    // قراءة العمولة والمبلغ الإجمالي المباشر من أعمدة الجدول
                    const commission = order.commission !== undefined && order.commission !== null ? order.commission : (order.total_commission || '0.00');
                    const totalAmount = order.total_amount !== undefined && order.total_amount !== null ? order.total_amount : '0.00';
                    
                    // بيانات إضافية محلية للمسوق والبنك
                    const extraData = JSON.parse(localStorage.getItem('extra_' + orderId) || '{}');
                    const marketer = extraData.marketer || order.custom_marketer_name || '';
                    const bank = extraData.bank || order.custom_bank_name || '';
                    const account = extraData.account || order.custom_marketer_account || '';

                    html += `
                    <tr class="border-b border-gray-100 hover:bg-gray-50">
                        <td class="p-4 font-bold text-slate-900">#${orderId}</td>
                        <td class="p-4">
                            <div class="font-bold">${clientName}</div>
                            <div class="text-emerald-600 dir-ltr text-xs">📱 ${phone1}</div>
                            <div class="text-indigo-600 dir-ltr text-xs">📞 ${phone2}</div>
                        </td>
                        <td class="p-4 space-y-1">
                            <input type="text" placeholder="اسم المسوق" value="${marketer}" oninput="saveExtraInput(${orderId}, 'marketer', this.value)" class="w-full p-1 border rounded text-xs">
                            <input type="text" placeholder="البنك" value="${bank}" oninput="saveExtraInput(${orderId}, 'bank', this.value)" class="w-full p-1 border rounded text-xs">
                            <input type="text" placeholder="رقم الحساب" value="${account}" oninput="saveExtraInput(${orderId}, 'account', this.value)" class="w-full p-1 border rounded text-xs">
                        </td>
                        <td class="p-4 font-bold text-purple-700">${commission} ج.س</td>
                        <td class="p-4 font-extrabold text-emerald-600">${totalAmount} ج.س</td>
                        <td class="p-4 text-center">
                            <div class="flex items-center justify-center gap-1">
                                <button onclick='openDirectModal(${JSON.stringify(order)})' class="bg-blue-50 hover:bg-blue-100 text-blue-600 font-bold px-3 py-1.5 rounded-lg text-xs">👁️ معاينة</button>
                                <button onclick="unapproveOrder(${orderId})" class="bg-amber-50 hover:bg-amber-100 text-amber-700 font-bold px-3 py-1.5 rounded-lg text-xs">↩️ إلغاء الاعتماد</button>
                            </div>
                        </td>
                    </tr>`;
                });

                tableBody.innerHTML = html;

            } catch (err) {
                console.error(err);
                tableBody.innerHTML = `<tr><td colspan="6" class="text-center p-8 text-rose-500">حدث خطأ أثناء جلب الفواتير: ${err.message}</td></tr>`;
            }
        }

        function saveExtraInput(orderId, field, value) {
            let extra = JSON.parse(localStorage.getItem('extra_' + orderId) || '{}');
            extra[field] = value;
            localStorage.setItem('extra_' + orderId, JSON.stringify(extra));
        }

        async function unapproveOrder(orderId) {
            if (!confirm(`هل تريد حقاً إزالة الاعتماد عن الطلب #${orderId} وإعادته للطلبات المعلقة؟`)) return;
            try {
                await supabase.from('web_orders').update({ is_approved: false }).eq('id_web_order', orderId);
                fetchDirectApprovedInvoices();
            } catch (e) {
                alert('فشل تحديث حالة الطلب');
            }
        }

        function openDirectModal(order) {
            activeInvoiceData = order;
            const modalContent = document.getElementById('invoicePrintArea');
            
            const orderId = order.id_web_order || order.id || '-';
            const commission = order.commission !== undefined && order.commission !== null ? order.commission : (order.total_commission || '0.00');
            const totalAmount = order.total_amount !== undefined && order.total_amount !== null ? order.total_amount : '0.00';
            
            const extra = JSON.parse(localStorage.getItem('extra_' + orderId) || '{}');

            modalContent.innerHTML = `
                <div class="text-center border-b pb-3">
                    <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-3 py-0.5 rounded-full">فاتورة معتمدة رسمياً ✅</span>
                    <h2 class="text-base font-black mt-1">طلب رقم #${orderId}</h2>
                    <p class="text-gray-400 text-[10px]">${order.date_created ? new Date(order.date_created).toLocaleString('ar-SD') : ''}</p>
                </div>
                <div class="bg-gray-50 p-3 rounded-xl space-y-1">
                    <div><b>العميل:</b> ${order.client_name || '-'}</div>
                    <div class="dir-ltr text-right"><b>الهاتف:</b> ${order.client_phone || '-'}</div>
                    <div class="dir-ltr text-right"><b>الهاتف الثاني:</b> ${order.client_second_phone || 'لا يوجد'}</div>
                    <div><b>العنوان:</b> ${order.client_address || 'لم يحدد'}</div>
                </div>
                <div class="bg-indigo-50 p-3 rounded-xl space-y-1">
                    <div><b>المسوق:</b> ${extra.marketer || order.custom_marketer_name || 'غير مسجل'}</div>
                    <div><b>البنك والحساب:</b> ${extra.bank || '-'} | ${extra.account || '-'}</div>
                </div>
                <div class="space-y-1 text-right border-t pt-2">
                    <div class="flex justify-between"><span>العمولة المسجلة:</span><b class="text-purple-600">${commission} ج.س</b></div>
                    <div class="flex justify-between text-sm font-black bg-emerald-900 text-white p-2.5 rounded-lg mt-2">
                        <span>الإجمالي الكلي:</span><span>${totalAmount} ج.س</span>
                    </div>
                </div>
            `;
            document.getElementById('directModal').classList.remove('hidden');
        }

        function closeDirectModal() {
            document.getElementById('directModal').classList.add('hidden');
        }

        function sendWhatsApp() {
            if (!activeInvoiceData) return;
            const phone = (activeInvoiceData.client_phone || '').replace(/[^0-9]/g, '');
            const total = activeInvoiceData.total_amount || 0;
            const text = `مرحباً ${activeInvoiceData.client_name || ''}، فاتورتك رقم #${activeInvoiceData.id_web_order} بقيمة ${total} ج.س معتمدة وجاهزة.`;
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');
        }

        window.onload = fetchDirectApprovedInvoices;
    </script>
</body>
</html>
